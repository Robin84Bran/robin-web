<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">The humanoid evidence ladder</title><desc id="desc">Four conceptual stages: equipment sold, customer acceptance, productive operation and unit economics. Each stage needs its own evidence. No conversion rate, company ranking or observed cost is shown.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8b7660"/></marker></defs>
<rect width="1200" height="740" fill="#f5f2ec"/>
<g font-family="Arial,sans-serif" fill="#302e2a">
<text x="58" y="62" font-size="15" letter-spacing="3">PHYSICAL AI / THE HUMANOID EVIDENCE LEDGER</text>
<text x="58" y="126" font-family="Georgia,serif" font-size="43">From a machine sold to useful work.</text>
<text x="58" y="170" font-size="20" fill="#69645d">Four different records. One honest account of what is known.</text>
<rect x="58" y="360" width="253" height="171" rx="8" fill="#fffdfa" stroke="#c8bbaa"/><text x="75" y="399" font-size="18" letter-spacing="1">01  SOLD</text><text x="75" y="450" font-size="19">Buyer and purpose</text><text x="75" y="495" font-size="17" fill="#69645d">What was purchased?</text><path d="M312 415L331 391" stroke="#8b7660" stroke-width="2" marker-end="url(#arrow)"/><rect x="335" y="320" width="253" height="171" rx="8" fill="#fffdfa" stroke="#c8bbaa"/><text x="352" y="359" font-size="18" letter-spacing="1">02  ACCEPTED</text><text x="352" y="410" font-size="19">Task and threshold</text><text x="352" y="455" font-size="17" fill="#69645d">What passed?</text><path d="M589 375L608 351" stroke="#8b7660" stroke-width="2" marker-end="url(#arrow)"/><rect x="612" y="280" width="253" height="171" rx="8" fill="#fffdfa" stroke="#c8bbaa"/><text x="629" y="319" font-size="18" letter-spacing="1">03  PRODUCTIVE</text><text x="629" y="370" font-size="19">Output and assistance</text><text x="629" y="415" font-size="17" fill="#69645d">What repeated?</text><path d="M866 335L885 311" stroke="#8b7660" stroke-width="2" marker-end="url(#arrow)"/><rect x="889" y="240" width="253" height="171" rx="8" fill="#fffdfa" stroke="#c8bbaa"/><text x="906" y="279" font-size="18" letter-spacing="1">04  ECONOMICS</text><text x="906" y="330" font-size="19">Full cost and payer</text><text x="906" y="375" font-size="17" fill="#69645d">What did it cost?</text><rect x="58" y="570" width="1084" height="86" rx="8" fill="#e2e6df"/>
<text x="82" y="605" font-size="19">KEEP VISIBLE: CUSTOMER / TASK / PERIOD / HUMAN SUPPORT / COST</text>
<text x="82" y="637" font-size="17" fill="#69645d">Undisclosed ≠ zero. Target ≠ outcome. Cumulative output ≠ comparable productivity.</text>
<text x="58" y="704" font-size="14" fill="#69645d">Original analytical framework • 2026-09-24 • No conversion rates or vendor cost estimates</text>
</g></svg>