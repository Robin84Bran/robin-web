<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Four payment clocks</title><desc id="desc">A conceptual sequence of authorization, settlement, availability and reconciliation. Each step asks a different question. No actual timing or cost is shown.</desc><rect width="1200" height="700" fill="#f5f2ec"/><g font-family="Arial,sans-serif" fill="#302e2a"><text x="58" y="60" font-size="15" letter-spacing="3">PAYMENTS / THE WEEKEND SETTLEMENT GAP</text><text x="58" y="126" font-family="Georgia,serif" font-size="44">When can the merchant use the money?</text><text x="58" y="172" font-size="21" fill="#69645d">One payment. Four questions. Keep each timestamp.</text><rect x="58" y="250" width="253" height="210" rx="8" fill="#fffdfa" stroke="#c8bbaa"/><text x="74" y="298" font-size="19">01 AUTHORIZE</text><text x="74" y="370" font-size="21">May this purchase</text><text x="74" y="405" font-size="21">proceed?</text><rect x="335" y="250" width="253" height="210" rx="8" fill="#fffdfa" stroke="#c8bbaa"/><text x="351" y="298" font-size="19">02 SETTLE</text><text x="351" y="370" font-size="21">Has the obligation</text><text x="351" y="405" font-size="21">been discharged?</text><rect x="612" y="250" width="253" height="210" rx="8" fill="#fffdfa" stroke="#c8bbaa"/><text x="628" y="298" font-size="19">03 USE</text><text x="628" y="370" font-size="21">Can the recipient</text><text x="628" y="405" font-size="21">use the funds?</text><rect x="889" y="250" width="253" height="210" rx="8" fill="#fffdfa" stroke="#c8bbaa"/><text x="905" y="298" font-size="19">04 RECONCILE</text><text x="905" y="370" font-size="21">Do the records</text><text x="905" y="405" font-size="21">explain the amount?</text><rect x="58" y="510" width="1084" height="97" rx="8" fill="#e2e6df"/><text x="82" y="548" font-size="20">COMPARE THE SAME RECIPIENT AND THE SAME USABLE-CASH ENDPOINT</text><text x="82" y="580" font-size="17" fill="#69645d">Eligibility / prefunding / total cost / exception owner / recovery evidence</text><text x="58" y="660" font-size="15" fill="#69645d">Original conceptual framework • 2026-09-25 • No measured timing or provider cost estimate</text></g></svg>