<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Five gates from contract value to bankable cash flow</title><desc id="d">Offtake, Permit, Energize, Build, Refinance. Each gate requires separate documentary evidence. No numerical conversion rate or investment result is asserted.</desc><rect width="1600" height="900" fill="#f3f0e8"/><g font-family="Arial,sans-serif" fill="#253029"><text x="80" y="75" font-size="19" letter-spacing="3">OUROBOROS / AI INFRASTRUCTURE / 19 SEP 2026</text><text x="80" y="158" font-size="60">A contract still has to become cash.</text><text x="80" y="220" font-size="25" fill="#5b665f">Five evidence gates. Every missing dependency matters.</text><rect x="80" y="300" width="270" height="220" rx="7" fill="#dce5dc"/><text x="100" y="354" font-size="25">01 / OFFTAKE</text><text x="100" y="410" font-size="22">Enforceable payment</text><text x="100" y="470" font-size="22" fill="#536059">Who must pay?</text><path d="M354 412h16m-6 -6 6 6-6 6" stroke="#68786a" stroke-width="2" fill="none"/><rect x="374" y="325" width="270" height="220" rx="7" fill="#dbe2e4"/><text x="394" y="379" font-size="25">02 / PERMIT</text><text x="394" y="435" font-size="22">Effective approvals</text><text x="394" y="495" font-size="22" fill="#536059">What is allowed?</text><path d="M648 437h16m-6 -6 6 6-6 6" stroke="#68786a" stroke-width="2" fill="none"/><rect x="668" y="350" width="270" height="220" rx="7" fill="#eadfbe"/><text x="688" y="404" font-size="25">03 / ENERGIZE</text><text x="688" y="460" font-size="22">Usable power</text><text x="688" y="520" font-size="22" fill="#536059">When is it live?</text><path d="M942 462h16m-6 -6 6 6-6 6" stroke="#68786a" stroke-width="2" fill="none"/><rect x="962" y="375" width="270" height="220" rx="7" fill="#e9d8dd"/><text x="982" y="429" font-size="25">04 / BUILD</text><text x="982" y="485" font-size="22">Accepted delivery</text><text x="982" y="545" font-size="22" fill="#536059">Who funds delay?</text><path d="M1236 487h16m-6 -6 6 6-6 6" stroke="#68786a" stroke-width="2" fill="none"/><rect x="1256" y="400" width="270" height="220" rx="7" fill="#dedce7"/><text x="1276" y="454" font-size="25">05 / REFINANCE</text><text x="1276" y="510" font-size="22">Credible takeout</text><text x="1276" y="570" font-size="22" fill="#536059">Who holds risk?</text><path d="M80 685H1520" stroke="#adb5aa"/><text x="80" y="742" font-size="28">Headline value → enforceable revenue → project cash → debt service</text><text x="80" y="805" font-size="23" fill="#536059">Quotes are not realized losses. Applications are not operating permissions.</text><text x="80" y="859" font-size="18" fill="#657169">AUTHOR'S ANALYTICAL FRAMEWORK / NO NUMERICAL HAIRCUT IMPLIED / UNKNOWN TERMS STAY UNKNOWN</text></g></svg>