<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">A referee you can replace</title><desc id="desc">Proposed evidence design separates public rules, permissioned observations, saved events and replaceable judgment. It shows no measured tournament results.</desc><rect width="1600" height="1000" fill="#f4f1e9"/><g fill="#25372e" font-family="Arial,sans-serif"><text x="90" y="90" font-size="22" letter-spacing="4">OUROBOROS / OPEN EVALUATION DESIGN</text><text x="90" y="174" font-size="58">A referee you can replace</text><text x="90" y="230" font-size="28">Keep the evidence. Change the judge. Inspect the difference.</text><rect x="90" y="280" width="1420" height="125" rx="8" fill="#dce6dd"/><text x="115" y="328" font-size="23">01 / PUBLIC RULES</text><text x="600" y="327" font-size="27">What counts as a valid outcome?</text><text x="600" y="369" font-size="22" fill="#526258">Versioned rules, declared budgets and objective checks.</text><rect x="90" y="425" width="1420" height="125" rx="8" fill="#e6dfce"/><text x="115" y="473" font-size="23">02 / PERMITTED OBSERVATIONS</text><text x="600" y="472" font-size="27">What could each agent see?</text><text x="600" y="514" font-size="22" fill="#526258">Public rules with role-specific private synthetic state.</text><rect x="90" y="570" width="1420" height="125" rx="8" fill="#e7d9dc"/><text x="115" y="618" font-size="23">03 / SAVED EVENTS</text><text x="600" y="617" font-size="27">Can the outcome be reconstructed?</text><text x="600" y="659" font-size="22" fill="#526258">Initial state, ordered actions, failures and known gaps.</text><rect x="90" y="715" width="1420" height="125" rx="8" fill="#dce2e7"/><text x="115" y="763" font-size="23">04 / REPLACEABLE JUDGMENT</text><text x="600" y="762" font-size="27">Which conclusions survive another judge?</text><text x="600" y="804" font-size="22" fill="#526258">Rescore the same answers. Preserve every disagreement.</text><text x="90" y="919" font-size="24">Proposed design / Experiment results UNKNOWN / Synthetic release packet only</text><text x="90" y="967" font-size="20" fill="#526258">Event replay, answer rescoring and fresh model reruns are three different claims.</text></g></svg>