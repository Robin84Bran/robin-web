<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#f4f1e9"/><g fill="#25372e" font-family="Arial,sans-serif"><text x="90" y="95" font-size="23" letter-spacing="4">OUROBOROS / 20 SEPTEMBER 2026</text><text x="90" y="175" font-size="58">Who governs the referee?</text><text x="90" y="230" font-size="27">Four separate rights. One accountable decision.</text><rect x="90" y="280" width="1420" height="125" rx="8" fill="#dce6dd"/><text x="115" y="328" font-size="26">01 / ACCESS</text><text x="565" y="327" font-size="28">What can the evaluator inspect?</text><text x="565" y="369" font-size="23" fill="#526258">Scope, failed runs, interviews and recorded access gaps.</text><rect x="90" y="425" width="1420" height="125" rx="8" fill="#e6dfce"/><text x="115" y="473" font-size="26">02 / FUNDING</text><text x="565" y="472" font-size="28">Can uncomfortable work continue?</text><text x="565" y="514" font-size="23" fill="#526258">Duration, concentration and rights after termination.</text><rect x="90" y="570" width="1420" height="125" rx="8" fill="#e7d9dc"/><text x="115" y="618" font-size="26">03 / REPORTING</text><text x="565" y="617" font-size="28">Who can learn what was found?</text><text x="565" y="659" font-size="23" fill="#526258">Publication rights, redactions and disagreement receipts.</text><rect x="90" y="715" width="1420" height="125" rx="8" fill="#dce2e7"/><text x="115" y="763" font-size="26">04 / RELEASE AUTHORITY</text><text x="565" y="762" font-size="28">Who accepts the consequences?</text><text x="565" y="804" font-size="23" fill="#526258">Named decision maker and a tested escalation path.</text><text x="90" y="919" font-size="24">Proposed governance framework. Current private contract terms remain UNKNOWN.</text><text x="90" y="967" font-size="19" fill="#526258">Based on inspected primary sources / This is not the partnership's organization chart.</text></g></svg>