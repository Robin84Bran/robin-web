<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc">
<title id="title">Open weights and the whole service</title><desc id="desc">Illustrative decimal raw-weight storage for 501 billion parameters:1002GB at two bytes,501GB at one byte,250.5GB at half a byte. Not observed Beam requirements. Caches, buffers, networking and operations are additional.</desc>
<rect width="1000" height="820" fill="#f5f1e9"/>
<g font-family="Arial,sans-serif" fill="#302e2a">
<text x="50" y="65" font-size="34">A smaller active count is only one part.</text>
<text x="50" y="108" font-size="22">501B total parameters · illustrative raw-weight storage</text>
<text x="50" y="168" font-size="22">2 bytes</text><rect x="205" y="140" width="620" height="42" rx="4" fill="#887968"/><text x="840" y="169" font-size="22">1,002 GB</text>
<text x="50" y="238" font-size="22">1 byte</text><rect x="205" y="210" width="310" height="42" rx="4" fill="#9eaaab"/><text x="535" y="239" font-size="22">501 GB</text>
<text x="50" y="308" font-size="22">0.5 byte</text><rect x="205" y="280" width="155" height="42" rx="4" fill="#c4a39c"/><text x="380" y="309" font-size="22">250.5 GB</text>
<text x="50" y="378" font-size="22">Decimal units. Metadata and all serving overhead excluded.</text>
<text x="50" y="414" font-size="22">These are calculations, not measured Beam requirements.</text>
<path d="M50 450H950" stroke="#b9b1a6"/>
<text x="50" y="504" font-size="28">What the complete service must account for</text>
<g fill="none" stroke="#9e9487" stroke-width="2"><rect x="50" y="540" width="425" height="86" rx="8"/><rect x="525" y="540" width="425" height="86" rx="8"/><rect x="50" y="650" width="425" height="86" rx="8"/><rect x="525" y="650" width="425" height="86" rx="8"/></g>
<text x="75" y="593" font-size="24">Weights + supported precision</text><text x="550" y="593" font-size="24">Caches + runtime buffers</text><text x="75" y="703" font-size="24">Memory + network + power</text><text x="550" y="703" font-size="24">Utilization + recovery + people</text>
<text x="50" y="788" font-size="20">Model access creates choices. A reliable service still has an owner.</text>
</g></svg>
