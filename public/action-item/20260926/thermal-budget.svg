<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">The thermal budget of orbital computing</title><desc id="desc">Power feeds computing. Useful output is checked and heat must leave via a radiator. Idealized one megawatt of heat at emissivity 0.9 requires about 2420, 1306, or 765 square metres of emitting surface at 300, 350, or 400 kelvin. This is not a spacecraft design.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#7c6956" stroke-width="1.5"/></marker></defs><rect width="1200" height="820" fill="#f5f2ec"/><g font-family="Arial,sans-serif" fill="#302e2a"><text x="58" y="60" font-size="16" letter-spacing="3">IAMROBIN.AI / ORBITAL COMPUTING</text><text x="58" y="125" font-family="Georgia,serif" font-size="45">The heat still has to leave.</text><text x="58" y="171" font-size="21" fill="#69645d">A conceptual system boundary, followed by an idealized calculation.</text>
<rect x="58" y="230" width="225" height="108" rx="8" fill="#e7dccb"/><text x="80" y="273" font-size="23">POWER IN</text><text x="80" y="308" font-size="18">Electrical input</text>
<path d="M283 284H357" stroke="#7c6956" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="367" y="230" width="270" height="108" rx="8" fill="#fffdfa" stroke="#b6a894"/><text x="389" y="273" font-size="23">COMPUTE</text><text x="389" y="308" font-size="18">Run a defined workload</text>
<path d="M637 284H757" stroke="#7c6956" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="767" y="230" width="375" height="108" rx="8" fill="#e2e6df"/><text x="790" y="273" font-size="23">ACCEPTED OUTPUT</text><text x="790" y="308" font-size="18">Correct, timely, recoverable work</text>
<path d="M501 338V390H757" fill="none" stroke="#b16b48" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="767" y="360" width="375" height="67" rx="8" fill="#ead4c4"/><text x="790" y="402" font-size="23">HEAT OUT / RADIATOR</text>
<text x="58" y="463" font-size="21">Illustration: reject 1 MW of heat with emissivity 0.9</text><text x="58" y="520" font-size="20">300 K / 27°C</text><rect x="250" y="492" width="680" height="40" fill="#b49878" rx="3"/><text x="950" y="520" font-size="21">2,420 m²</text><text x="58" y="585" font-size="20">350 K / 77°C</text><rect x="250" y="557" width="367" height="40" fill="#b49878" rx="3"/><text x="637" y="585" font-size="21">1,306 m²</text><text x="58" y="650" font-size="20">400 K / 127°C</text><rect x="250" y="622" width="215" height="40" fill="#b49878" rx="3"/><text x="485" y="650" font-size="21">765 m²</text><text x="58" y="721" font-size="17" fill="#69645d">Uniform temperature, cold sink, no incoming radiation; total emitting area, not footprint.</text><text x="58" y="752" font-size="17" fill="#69645d">Higher temperature reduces area mathematically. Hardware tolerance remains unproven.</text><text x="58" y="790" font-size="14" fill="#69645d">Original calculation / NASA thermal relation / 2026-09-26 / Not a Google system design or cost estimate</text></g></svg>