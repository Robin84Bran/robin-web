<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">Organizational memory with verified return receipts</title><desc id="desc">Proposed protocol: identity registry supplies approved relationships, versioned project truth governs agent sessions, and tested outputs return through verified receipts. A receipt updates a project only through authorized promotion. Session recall never grants authority. Pilot is ready; comparative results unknown.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#899974" stroke-width="1.3"/></marker></defs><rect width="1440" height="820" fill="#f3f0e8"/><g font-family="Arial, sans-serif" fill="#242b27"><text x="70" y="80" font-size="15" letter-spacing="3">OUROBOROS / ORGANIZATIONAL MEMORY / 12 SEP 2026</text><text x="70" y="155" font-size="52">One accountable record.</text><text x="70" y="203" font-size="23" fill="#5c665e">Different memories. Explicit ownership. Evidence that returns.</text></g><g fill="none" stroke="#899974" stroke-width="3" marker-end="url(#arrow)"><path d="M360 385H395"/><path d="M695 385H730"/><path d="M1030 385H1065"/><path d="M1230 510V625H550V523"/></g><g font-family="Arial, sans-serif"><rect x="70" y="285" width="290" height="225" rx="8" fill="#fffdf7" stroke="#c8cbbd"/><rect x="405" y="285" width="290" height="225" rx="8" fill="#e3e8dc" stroke="#899974"/><rect x="740" y="285" width="290" height="225" rx="8" fill="#fffdf7" stroke="#c8cbbd"/><rect x="1075" y="285" width="290" height="225" rx="8" fill="#242f28"/>
<g fill="#242b27"><text x="95" y="325" font-size="14" letter-spacing="2">01 / IDENTITY</text><text x="95" y="380" font-size="26">Who owns intent?</text><text x="95" y="426" font-size="18">Approved names and links</text><text x="95" y="461" font-size="18">Dated relationships</text><text x="430" y="325" font-size="14" letter-spacing="2">02 / PROJECT TRUTH</text><text x="430" y="380" font-size="26">What governs now?</text><text x="430" y="426" font-size="18">Version, owner, evidence</text><text x="430" y="461" font-size="18">Unresolved boundaries</text><text x="765" y="325" font-size="14" letter-spacing="2">03 / AGENT SESSIONS</text><text x="765" y="380" font-size="26">What is the task?</text><text x="765" y="426" font-size="18">Bounded context and scope</text><text x="765" y="461" font-size="18">Recall points to evidence</text></g><g fill="#f3f0e8"><text x="1100" y="325" font-size="14" letter-spacing="2">04 / VERIFIED RECEIPT</text><text x="1100" y="380" font-size="26">What actually held?</text><text x="1100" y="426" font-size="18">Revision, tests, destination</text><text x="1100" y="461" font-size="18">Gaps and observed result</text></g><text x="655" y="590" font-size="20" fill="#5c665e">Authorized promotion after verification</text><text x="70" y="720" font-size="19" fill="#242b27">Prepared ≠ delivered ≠ incorporated. Recall never grants new authority.</text><text x="70" y="765" font-size="14" fill="#5c665e" letter-spacing="1.5">AUTHORED PROPOSAL · PILOT READY · COMPARATIVE RESULTS UNKNOWN</text></g></svg>