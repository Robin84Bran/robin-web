<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Who owns the AI brake?</title><desc id="desc">Four author-defined roles: Engine produces capability, Brake limits an activity, Referee verifies conditions, Capital chooses financed risks. Research framework, not measured market shares or confirmed institutional powers.</desc><rect width="1600" height="900" fill="#f3f0e8"/><g font-family="Arial,sans-serif" fill="#253029"><text x="80" y="75" font-size="19" letter-spacing="3">OUROBOROS / AI POLITICAL ECONOMY / 16 SEP 2026</text><text x="80" y="150" font-size="60">Who owns the AI brake?</text><text x="80" y="205" font-size="25" fill="#5b665f">Different rights. Different evidence. Different economics.</text><rect x="80" y="255" width="700" height="210" rx="7" fill="#dce5dc"/><text x="110" y="310" font-size="31">ENGINE</text><text x="110" y="363" font-size="25">Produces capability</text><text x="110" y="421" font-size="23" fill="#536059">What useful work is delivered?</text><rect x="815" y="255" width="700" height="210" rx="7" fill="#e9d8dd"/><text x="845" y="310" font-size="31">BRAKE</text><text x="845" y="363" font-size="25">Limits an activity</text><text x="845" y="421" font-size="23" fill="#536059">Who can stop or restrict it?</text><rect x="80" y="490" width="700" height="210" rx="7" fill="#dbe2e4"/><text x="110" y="545" font-size="31">REFEREE</text><text x="110" y="598" font-size="25">Verifies conditions</text><text x="110" y="656" font-size="23" fill="#536059">Who can require a new test?</text><rect x="815" y="490" width="700" height="210" rx="7" fill="#eadfbe"/><text x="845" y="545" font-size="31">CAPITAL</text><text x="845" y="598" font-size="25">Finances selected risks</text><text x="845" y="656" font-size="23" fill="#536059">Who pays and absorbs loss?</text><path d="M80 755H1515" stroke="#adb5aa"/><text x="80" y="803" font-size="23">For each role: payer · decision right · evidence · consequence of error</text><text x="80" y="854" font-size="18" fill="#657169">AUTHOR-DESIGNED FRAMEWORK · TRAINING RESTRAINT DOES NOT ESTABLISH TOTAL INDUSTRY CAPEX CUTS</text></g></svg>