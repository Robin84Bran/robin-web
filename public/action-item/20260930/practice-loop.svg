<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc"><title id="title">Who pays for the robot's practice?</title><desc id="desc">A proposed accounting loop: physical task, simulated practice, candidate policy, held-out physical acceptance. Include setup, compute, engineering and recovery. No experiment performed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#80705d" stroke-width="1.5"/></marker></defs><rect width="1200" height="840" fill="#f5f2ec"/><g font-family="Arial,sans-serif" fill="#302e2a"><text x="60" y="55" font-size="16" letter-spacing="3">IAMROBIN.AI / PHYSICAL AI</text><text x="60" y="116" font-family="Georgia,serif" font-size="44">Count the work around the work</text><text x="60" y="164" font-size="23" fill="#69645d">Proposed framework · matched tasks · unchanged acceptance rule</text><rect x="60" y="218" width="480" height="135" rx="8" fill="#e7dccb"/><text x="90" y="263" font-size="26">1 / PHYSICAL TASK</text><text x="90" y="309" font-size="21">Define scope, capture state, keep failures</text><rect x="660" y="218" width="480" height="135" rx="8" fill="#e2e6df"/><text x="690" y="263" font-size="26">2 / SIMULATED PRACTICE</text><text x="690" y="309" font-size="21">Vary what matters to this task</text><path d="M547 285H646" stroke="#80705d" stroke-width="2" marker-end="url(#arrow)"/><path d="M900 362V415" stroke="#80705d" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="433" width="480" height="135" rx="8" fill="#e7dccb"/><text x="690" y="478" font-size="26">3 / CANDIDATE POLICY</text><text x="690" y="524" font-size="21">Compare with a simple baseline</text><rect x="60" y="433" width="480" height="135" rx="8" fill="#e2e6df"/><text x="90" y="478" font-size="26">4 / PHYSICAL ACCEPTANCE</text><text x="90" y="524" font-size="21">Held-out cases · repeated verification</text><path d="M649 500H554" stroke="#80705d" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 423V366" stroke="#80705d" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="623" width="1080" height="120" rx="8" fill="#fffdfa" stroke="#b6a894"/><text x="90" y="670" font-size="24">TOTAL COST / ACCEPTED PHYSICAL CAPABILITIES</text><text x="90" y="712" font-size="21">Setup + compute + engineering + real tests + resets + recovery</text><text x="60" y="792" font-size="20" fill="#69645d">Author-designed proposal. No robot experiment or measured saving is claimed.</text></g></svg>