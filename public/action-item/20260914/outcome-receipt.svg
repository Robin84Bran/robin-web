<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Delivery evidence is a sequence of separate observations</title><desc id="desc">Generated requires a validated artifact. Published requires the intended version at its canonical URL. Discoverable requires a tested archive link; search indexing remains separate. Delivery recorded requires a channel send receipt. Recipient reading and usefulness remain unknown without independent evidence. This is an authored proposal, not observed performance data.</desc><rect width="1600" height="900" fill="#f3f0e8"/><g font-family="Arial,sans-serif" fill="#253029"><text x="75" y="80" font-size="19" letter-spacing="3">OUROBOROS / OUTCOME RECEIPT / PROPOSED CONTRACT</text><text x="75" y="163" font-size="58">The result needs its own proof.</text><text x="75" y="218" font-size="25" fill="#5b665f">Four observable states. No silent promotion from sent to read.</text><rect x="75" y="305" width="340" height="260" rx="8" fill="#e4e8e0"/><text x="99" y="355" font-size="24" fill="#657169">01</text><text x="99" y="420" font-size="23">GENERATED</text><text x="99" y="477" font-size="21">Validated artifact</text><text x="99" y="520" font-size="18" fill="#536059">Content and source checks</text><rect x="450" y="305" width="340" height="260" rx="8" fill="#dbe2e4"/><text x="474" y="355" font-size="24" fill="#657169">02</text><text x="474" y="420" font-size="23">PUBLISHED</text><text x="474" y="477" font-size="21">Intended public version</text><text x="474" y="520" font-size="18" fill="#536059">Canonical URL + payload</text><rect x="825" y="305" width="340" height="260" rx="8" fill="#ebe0cc"/><text x="849" y="355" font-size="24" fill="#657169">03</text><text x="849" y="420" font-size="23">DISCOVERABLE</text><text x="849" y="477" font-size="21">Working archive path</text><text x="849" y="520" font-size="18" fill="#536059">Indexing is separate</text><rect x="1200" y="305" width="340" height="260" rx="8" fill="#e9d8dd"/><text x="1224" y="355" font-size="24" fill="#657169">04</text><text x="1224" y="420" font-size="23">DELIVERY RECORDED</text><text x="1224" y="477" font-size="21">Channel send receipt</text><text x="1224" y="520" font-size="18" fill="#536059">Human reading UNKNOWN</text><text x="75" y="660" font-size="25">RECEIPT = REQUEST + VERSION + DESTINATION + TIME + EVIDENCE + LIMITATIONS</text><path d="M75 701H1510" stroke="#adb5aa"/><text x="75" y="755" font-size="25">Retry the unfinished boundary. Preserve what is already verified.</text><text x="75" y="825" font-size="20" fill="#657169">14 SEP 2026 · AUTHOR-DESIGNED FRAMEWORK · READING AND USE NEED SEPARATE OBSERVATIONS</text></g></svg>