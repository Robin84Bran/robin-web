<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">The recursive company</title><desc id="desc">Proposed feedback loop: execute an authorized task, verify the receiving outcome, remember a tested correction, route the next assignment better. Owner intent and consequential authority remain outside the loop. No performance results are asserted.</desc><rect width="1600" height="900" fill="#f3f0e8"/><g font-family="Arial,sans-serif" fill="#253029"><text x="80" y="75" font-size="19" letter-spacing="3">OUROBOROS / THE RECURSIVE COMPANY / 18 SEP 2026</text><text x="80" y="155" font-size="60">Let the next job inherit the lesson.</text><text x="80" y="215" font-size="25" fill="#5b665f">A proposed operating loop, measured by accepted outcomes.</text><rect x="80" y="300" width="330" height="225" rx="7" fill="#dce5dc"/><text x="102" y="355" font-size="29">01 / EXECUTE</text><text x="102" y="416" font-size="27">Bounded assignment</text><text x="102" y="475" font-size="22" fill="#536059">Existing authority</text><rect x="450" y="300" width="330" height="225" rx="7" fill="#dbe2e4"/><text x="472" y="355" font-size="29">02 / VERIFY</text><text x="472" y="416" font-size="27">Receiving outcome</text><text x="472" y="475" font-size="22" fill="#536059">Test + public receipt</text><rect x="820" y="300" width="330" height="225" rx="7" fill="#eadfbe"/><text x="842" y="355" font-size="29">03 / REMEMBER</text><text x="842" y="416" font-size="27">Tested correction</text><text x="842" y="475" font-size="22" fill="#536059">Trigger + rollback</text><rect x="1190" y="300" width="330" height="225" rx="7" fill="#e9d8dd"/><text x="1212" y="355" font-size="29">04 / ROUTE</text><text x="1212" y="416" font-size="27">Better next choice</text><text x="1212" y="475" font-size="22" fill="#536059">Same owner boundary</text><g stroke="#68786a" stroke-width="3" fill="none"><path d="M414 410h28m-9 -7 9 7-9 7M784 410h28m-9 -7 9 7-9 7M1154 410h28m-9 -7 9 7-9 7M1355 542v70H245v-70m-7 9 7-9 7 9"/></g><text x="487" y="654" font-size="24">Retain only lessons that survive the next test.</text><path d="M80 709H1520" stroke="#adb5aa"/><text x="80" y="756" font-size="25">Owner: intent · judgment · consequential authority</text><text x="80" y="809" font-size="22" fill="#536059">Measure: intervention · recovery · oversight · learning · cost per accepted outcome</text><text x="80" y="863" font-size="18" fill="#657169">AUTHOR'S ANALYTICAL MODEL / NOT AN AUTONOMY SCORE / MISSING MEASUREMENTS REMAIN UNKNOWN</text></g></svg>