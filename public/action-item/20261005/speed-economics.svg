<svg xmlns="http://www.w3.org/2000/svg" width="600" height="860" viewBox="0 0 600 860" role="img" aria-labelledby="title desc">
<title id="title">Faster generation changes only part of the clock</title><desc id="desc">Hypothetical arithmetic, not a measured product result. A twenty-minute task with four minutes of generation takes sixteen and a half minutes if generation is eight times faster. With sixteen minutes of generation it takes six minutes. Quality and all other conditions assumed equal.</desc>
<rect width="600" height="860" fill="#f5f2eb"/><g font-family="Arial, sans-serif" fill="#172b31"><text x="40" y="52" font-size="18" letter-spacing="2">ILLUSTRATION · NOT A PRODUCT TEST</text><text x="40" y="98" font-size="31" font-weight="700">Which part can get faster?</text><text x="40" y="132" font-size="21">Same assumed 8× generation acceleration.</text>
<rect x="40" y="164" width="22" height="22" fill="#24796e"/><text x="72" y="182" font-size="20">Generation</text><rect x="255" y="164" width="22" height="22" fill="#a9b1ac"/><text x="287" y="182" font-size="20">Other time</text>
<text x="40" y="240" font-size="25" font-weight="700">A · Waiting dominates</text><text x="40" y="274" font-size="21">Before: 4 + 16 = 20 minutes</text><rect x="40" y="290" width="96" height="38" fill="#24796e"/><rect x="136" y="290" width="384" height="38" fill="#a9b1ac"/>
<text x="40" y="364" font-size="21">After: 0.5 + 16 = 16.5 minutes</text><rect x="40" y="382" width="12" height="38" fill="#24796e"/><rect x="52" y="382" width="384" height="38" fill="#a9b1ac"/><text x="40" y="455" font-size="25" font-weight="700">17.5% less time · 1.21× throughput</text>
<path d="M40 488H560" stroke="#c9cbc4"/><text x="40" y="534" font-size="25" font-weight="700">B · Generation dominates</text><text x="40" y="568" font-size="21">Before: 16 + 4 = 20 minutes</text><rect x="40" y="584" width="384" height="38" fill="#24796e"/><rect x="424" y="584" width="96" height="38" fill="#a9b1ac"/>
<text x="40" y="658" font-size="21">After: 2 + 4 = 6 minutes</text><rect x="40" y="674" width="48" height="38" fill="#24796e"/><rect x="88" y="674" width="96" height="38" fill="#a9b1ac"/><text x="40" y="748" font-size="25" font-weight="700">70% less time · 3.33× throughput</text>
<text x="40" y="800" font-size="19">Assumes serial work and unchanged quality.</text><text x="40" y="828" font-size="19">Measure the real critical path before buying speed.</text></g></svg>
