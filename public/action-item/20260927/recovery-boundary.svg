<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">Recover the job, not merely the connection</title><desc id="desc">Conceptual recovery design. After a lost reply, preserve job identity and reconcile recorded and physical state. Confirm a completed effect, resume only authorized unfinished work, or hold when evidence conflicts. No robot experiment was performed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#7c6956" stroke-width="1.5"/></marker></defs><rect width="1200" height="810" fill="#f5f2ec"/><g font-family="Arial,sans-serif" fill="#302e2a"><text x="58" y="60" font-size="16" letter-spacing="3">IAMROBIN.AI / RECOVERY DESIGN</text><text x="58" y="126" font-family="Georgia,serif" font-size="45">The reply vanished. Did the job?</text><text x="58" y="174" font-size="22" fill="#69645d">A timeout leaves the effect uncertain. Reconcile before repeating.</text><rect x="58" y="228" width="250" height="110" rx="8" fill="#e7dccb"/><text x="80" y="271" font-size="24">LOST REPLY</text><text x="80" y="308" font-size="18">Keep the same job identity</text><path d="M308 283H384" stroke="#7c6956" stroke-width="2" marker-end="url(#arrow)"/><rect x="398" y="228" width="345" height="110" rx="8" fill="#fffdfa" stroke="#b6a894"/><text x="422" y="271" font-size="24">RECONCILE</text><text x="422" y="308" font-size="18">Job record + physical observation</text><path d="M743 283H804V514" fill="none" stroke="#7c6956" stroke-width="2"/><path d="M804 283H847M804 399H847M804 515H847" stroke="#7c6956" stroke-width="2" marker-end="url(#arrow)"/><rect x="860" y="232" width="282" height="98" rx="8" fill="#e2e6df"/><text x="882" y="272" font-size="23">CONFIRM</text><text x="882" y="303" font-size="17">Completion is evidenced</text><rect x="860" y="349" width="282" height="98" rx="8" fill="#e7dccb"/><text x="882" y="389" font-size="23">RESUME</text><text x="882" y="420" font-size="17">Only authorized remainder</text><rect x="860" y="465" width="282" height="98" rx="8" fill="#ead4c4"/><text x="882" y="505" font-size="23">HOLD</text><text x="882" y="536" font-size="17">Missing or conflicting proof</text><text x="58" y="418" font-family="Georgia,serif" font-size="28">One job. One intended effect.</text><text x="58" y="463" font-size="21">A request identifier helps prevent duplicates.</text><text x="58" y="501" font-size="21">An observation helps establish what moved.</text><text x="58" y="539" font-size="21">Neither turns a physical action into a database rollback.</text><path d="M58 620H1142" stroke="#b6a894"/><text x="58" y="666" font-size="21">Acceptance trace: intention → owner → effect → evidence → permitted next step</text><text x="58" y="710" font-size="18" fill="#69645d">Conceptual framework informed by ROS 2 and AWS documentation.</text><text x="58" y="748" font-size="18" fill="#69645d">Proposed simulation only. No robot test, vendor benchmark or measured performance claim.</text></g></svg>