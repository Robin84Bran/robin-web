<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">A newsroom that learns from distribution</title><desc id="desc">Proposed workflow. A fixed fact and rights packet supports twenty frames. Two reviewed variants enter authorized distribution. Observations pass review before a conditional lesson returns to editorial memory. No performance data is shown.</desc>
