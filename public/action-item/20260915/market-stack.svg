<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Who receives the recurring fee?</title><desc id="desc">Five handoffs from asset to venue, data, surveillance and settlement. Issuance rights and corporate actions span the market. Each stage names a research question. This author-designed framework does not represent measured market share or verified supplier profits.</desc><rect width="1600" height="900" fill="#f3f0e8"/><g font-family="Arial,sans-serif" fill="#253029"><text x="75" y="80" font-size="19" letter-spacing="3">OUROBOROS / ONCHAIN MARKETS / RESEARCH FRAMEWORK</text><text x="75" y="163" font-size="58">Who receives the recurring fee?</text><text x="75" y="220" font-size="25" fill="#5b665f">Trace the customer, the service, and the economic claim.</text><rect x="75" y="305" width="272" height="260" rx="7" fill="#e4e8e0"/><text x="93" y="351" font-size="23" fill="#657169">01</text><text x="93" y="410" font-size="22">ASSET</text><text x="93" y="472" font-size="19">What rights exist?</text><text x="93" y="520" font-size="17" fill="#536059">Issuer / holder record</text><text x="350" y="442" font-size="22">→</text><rect x="369" y="305" width="272" height="260" rx="7" fill="#dbe2e4"/><text x="387" y="351" font-size="23" fill="#657169">02</text><text x="387" y="410" font-size="22">VENUE</text><text x="387" y="472" font-size="19">Who returns to trade?</text><text x="387" y="520" font-size="17" fill="#536059">Liquidity after incentives</text><text x="644" y="442" font-size="22">→</text><rect x="663" y="305" width="272" height="260" rx="7" fill="#eadfbe"/><text x="681" y="351" font-size="23" fill="#657169">03</text><text x="681" y="410" font-size="22">DATA</text><text x="681" y="472" font-size="19">Who pays and renews?</text><text x="681" y="520" font-size="17" fill="#536059">Licensing / recurring fees</text><text x="938" y="442" font-size="22">→</text><rect x="957" y="305" width="272" height="260" rx="7" fill="#e9d8dd"/><text x="975" y="351" font-size="23" fill="#657169">04</text><text x="975" y="410" font-size="22">SURVEILLANCE</text><text x="975" y="472" font-size="19">Who resolves abuse?</text><text x="975" y="520" font-size="17" fill="#536059">Monitoring / accountability</text><text x="1232" y="442" font-size="22">→</text><rect x="1251" y="305" width="272" height="260" rx="7" fill="#dce5dc"/><text x="1269" y="351" font-size="23" fill="#657169">05</text><text x="1269" y="410" font-size="22">SETTLEMENT</text><text x="1269" y="472" font-size="19">Which record controls?</text><text x="1269" y="520" font-size="17" fill="#536059">Custody / reconciliation</text><path d="M75 615H1520" stroke="#adb5aa"/><text x="75" y="663" font-size="25">ISSUANCE RIGHTS + CORPORATE ACTIONS SPAN THE WHOLE SEQUENCE</text><text x="75" y="735" font-size="23">Six checks: retention · organic fees · recurring revenue · rights · interoperability · value capture</text><text x="75" y="820" font-size="19" fill="#657169">15 SEP 2026 · AUTHOR-DESIGNED MAP · INVESTMENT ANNOUNCEMENTS DO NOT PROVE OPERATING RETURNS</text></g></svg>