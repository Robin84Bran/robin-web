<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">When AI chips become collateral</title><desc id="desc">Analytical financing relationships: announced five billion dollar equity commitment supports chips; customer contracts and chip value reportedly support twenty-two billion dollars of debt; possible later refinancing remains uncommitted. Not a verified transfer schedule or credit rating.</desc><rect width="1600" height="900" fill="#f3f0e8"/><g font-family="Arial,sans-serif" fill="#253029"><text x="80" y="75" font-size="19" letter-spacing="3">OUROBOROS / COMPUTE CREDIT / 17 SEP 2026</text><text x="80" y="150" font-size="58">When AI chips become collateral</text><text x="80" y="209" font-size="25" fill="#5b665f">The asset, the customer and the repayment clock must fit.</text><rect x="80" y="260" width="450" height="205" rx="7" fill="#dce5dc"/><text x="106" y="313" font-size="31">EQUITY</text><text x="106" y="372" font-size="28">$5bn commitment</text><text x="106" y="425" font-size="21" fill="#536059">Company announcement</text><rect x="575" y="260" width="450" height="205" rx="7" fill="#dbe2e4"/><text x="601" y="313" font-size="31">CHIPS</text><text x="601" y="372" font-size="28">TPUs + operating rights</text><text x="601" y="425" font-size="21" fill="#536059">Ownership alone is insufficient</text><rect x="1070" y="260" width="450" height="205" rx="7" fill="#eadfbe"/><text x="1096" y="313" font-size="31">CONTRACTS</text><text x="1096" y="372" font-size="28">Customer cash flow</text><text x="1096" y="425" font-size="21" fill="#536059">Terms remain UNKNOWN</text><rect x="330" y="530" width="450" height="205" rx="7" fill="#e9d8dd"/><text x="356" y="583" font-size="31">DEBT</text><text x="356" y="642" font-size="28">$22bn reported</text><text x="356" y="695" font-size="21" fill="#536059">No signed terms verified</text><rect x="830" y="530" width="450" height="205" rx="7" fill="#dce5dc"/><text x="856" y="583" font-size="31">REFINANCE</text><text x="856" y="642" font-size="28">Possible bond takeout</text><text x="856" y="695" font-size="21" fill="#536059">No rating or funding assured</text><g stroke="#68786a" stroke-width="3" fill="none"><path d="M535 361h30m-9 -7 9 7-9 7M1030 361h30m-9 -7 9 7-9 7M1295 475v23H555v23m-7 -9 7 9 7-9M790 632h30m-9 -7 9 7-9 7"/></g><path d="M80 775H1520" stroke="#adb5aa"/><text x="80" y="823" font-size="24">Underwrite: control rights · residual value · customer payments · no-refinance survival</text><text x="80" y="869" font-size="18" fill="#657169">AUTHOR'S ANALYTICAL MAP / RELATIONSHIPS, NOT CASH TRANSFER ORDER / $5bn + $22bn IS NOT VERIFIED LTV</text></g></svg>