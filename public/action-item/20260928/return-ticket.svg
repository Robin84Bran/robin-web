<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">An agent needs a return ticket</title><desc id="desc">Conceptual migration acceptance contract. Establish a task and destination grant, execute bounded work, return an identified artifact, then verify it. Revocation and retention apply throughout. Proposed framework, not a measured cloud experiment.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#80705d" stroke-width="1.5"/></marker></defs><rect width="1200" height="800" fill="#f5f2ec"/><g font-family="Arial,sans-serif" fill="#302e2a"><text x="60" y="57" font-size="16" letter-spacing="3">IAMROBIN.AI / AGENT INFRASTRUCTURE</text><text x="60" y="119" font-family="Georgia,serif" font-size="45">Work leaves. Evidence comes home.</text><text x="60" y="163" font-size="22" fill="#69645d">A shared interface does not prove a shared grant of authority.</text><rect x="60" y="211" width="475" height="143" rx="8" fill="#e7dccb"/><text x="87" y="252" font-size="25">1 / DESTINATION GRANT</text><text x="87" y="292" font-size="21">Named task · resources · allowed effects</text><text x="87" y="326" font-size="19">Recheck the effective permissions</text><path d="M535 280H650" stroke="#80705d" stroke-width="2" marker-end="url(#arrow)"/><rect x="665" y="211" width="475" height="143" rx="8" fill="#fffdfa" stroke="#b6a894"/><text x="692" y="252" font-size="25">2 / BOUNDED WORK</text><text x="692" y="292" font-size="21">Known input · scoped workspace</text><text x="692" y="326" font-size="19">Record actual checks and exceptions</text><path d="M902 354V416" stroke="#80705d" stroke-width="2" marker-end="url(#arrow)"/><rect x="665" y="431" width="475" height="143" rx="8" fill="#e2e6df"/><text x="692" y="472" font-size="25">3 / RETURN ARTIFACT</text><text x="692" y="512" font-size="21">Identified output · receiving destination</text><text x="692" y="546" font-size="19">Distinguish partial from complete</text><path d="M665 501H550" stroke="#80705d" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="431" width="475" height="143" rx="8" fill="#ead4c4"/><text x="87" y="472" font-size="25">4 / VERIFY THE RESULT</text><text x="87" y="512" font-size="21">Acceptance criteria · review · receipt</text><text x="87" y="546" font-size="19">Publication needs its own authority</text><path d="M60 630H1140" stroke="#b6a894"/><text x="60" y="674" font-size="22">Throughout: revoke effective access · preserve evidence before expiry</text><text x="60" y="719" font-size="19" fill="#69645d">Author-designed acceptance framework informed by Docker documentation.</text><text x="60" y="756" font-size="19" fill="#69645d">Proposed exercise only. No cloud workload or vendor performance test performed.</text></g></svg>