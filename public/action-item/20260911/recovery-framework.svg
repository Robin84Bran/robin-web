<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Proposed agent recovery workflow</title><desc id="desc">Checkpoint, fault, reconciliation, optional rescue, deterministic verification, and a tested routing lesson. No measured performance is implied.</desc><rect width="1600" height="900" fill="#f5f1e9"/><text x="80" y="100" font-family="Georgia" font-size="48" fill="#2e2a26">Recovery needs a receipt.</text><text x="80" y="145" font-family="Arial" font-size="22" fill="#6d655b">PROPOSED CONTROLLED EXPERIMENT · NO PERFORMANCE CLAIM</text><rect x="80" y="220" width="455" height="195" rx="4" fill="#fffdf8" stroke="#cbbfad"/><text x="105" y="263" font-family="Arial" font-size="24" fill="#9b7950">01</text><text x="105" y="316" font-family="Arial" font-size="27" fill="#2e2a26">CHECKPOINT</text><text x="105" y="362" font-family="Arial" font-size="22" fill="#6d655b">Intent · authority · receipts</text><path d="M546 318h20l-6 -6m6 6l-6 6" stroke="#9b7950" fill="none" stroke-width="2"/><rect x="580" y="220" width="455" height="195" rx="4" fill="#fffdf8" stroke="#cbbfad"/><text x="605" y="263" font-family="Arial" font-size="24" fill="#9b7950">02</text><text x="605" y="316" font-family="Arial" font-size="27" fill="#2e2a26">FAILURE</text><text x="605" y="362" font-family="Arial" font-size="22" fill="#6d655b">One controlled fault</text><path d="M1046 318h20l-6 -6m6 6l-6 6" stroke="#9b7950" fill="none" stroke-width="2"/><rect x="1080" y="220" width="455" height="195" rx="4" fill="#fffdf8" stroke="#cbbfad"/><text x="1105" y="263" font-family="Arial" font-size="24" fill="#9b7950">03</text><text x="1105" y="316" font-family="Arial" font-size="27" fill="#2e2a26">RECONCILE</text><text x="1105" y="362" font-family="Arial" font-size="22" fill="#6d655b">Read state before retry</text><rect x="80" y="480" width="455" height="195" rx="4" fill="#fffdf8" stroke="#cbbfad"/><text x="105" y="523" font-family="Arial" font-size="24" fill="#9b7950">04</text><text x="105" y="576" font-family="Arial" font-size="27" fill="#2e2a26">RESCUE IF NEEDED</text><text x="105" y="622" font-family="Arial" font-size="22" fill="#6d655b">Sol → scoped Astra repair</text><path d="M546 578h20l-6 -6m6 6l-6 6" stroke="#9b7950" fill="none" stroke-width="2"/><rect x="580" y="480" width="455" height="195" rx="4" fill="#fffdf8" stroke="#cbbfad"/><text x="605" y="523" font-family="Arial" font-size="24" fill="#9b7950">05</text><text x="605" y="576" font-family="Arial" font-size="27" fill="#2e2a26">VERIFY</text><text x="605" y="622" font-family="Arial" font-size="22" fill="#6d655b">Tests · effects · constraints</text><path d="M1046 578h20l-6 -6m6 6l-6 6" stroke="#9b7950" fill="none" stroke-width="2"/><rect x="1080" y="480" width="455" height="195" rx="4" fill="#fffdf8" stroke="#cbbfad"/><text x="1105" y="523" font-family="Arial" font-size="24" fill="#9b7950">06</text><text x="1105" y="576" font-family="Arial" font-size="27" fill="#2e2a26">LEARN</text><text x="1105" y="622" font-family="Arial" font-size="22" fill="#6d655b">Test a bounded routing rule</text><text x="80" y="800" font-family="Arial" font-size="25" fill="#2e2a26">Acceptance = intended result + reconciled effects + unchanged authority</text><text x="80" y="846" font-family="Arial" font-size="21" fill="#6d655b">Track failed attempts, state loss, duplicates, violations, founder minutes and full cost.</text></svg>