<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">The receiver is part of the workflow</title><desc id="desc">Conceptual diagram: output enters a receiving queue; evidence and authority are checked before acceptance and use. Unresolved work retains an owner.</desc>
<rect width="1200" height="650" fill="#f5f1e8"/><g font-family="Arial,sans-serif" fill="#252d2a">
<text x="60" y="85" font-size="38">Who receives the finished work?</text><text x="60" y="130" font-size="21" fill="#665f55">Conceptual workflow · No measured company throughput</text>
<g stroke="#829388" stroke-width="2" fill="#faf8f2"><rect x="60" y="220" width="245" height="165" rx="12"/><rect x="405" y="220" width="365" height="165" rx="12"/><rect x="870" y="220" width="270" height="165" rx="12"/></g>
<text x="88" y="265" font-size="24">OUTPUT</text><text x="88" y="309" font-size="20">Artifact + evidence</text><text x="88" y="343" font-size="20">Job identity</text>
<text x="433" y="265" font-size="24">RECEIVING QUEUE</text><text x="433" y="309" font-size="20">Check quality and authority</text><text x="433" y="343" font-size="20">Record time and open gaps</text>
<text x="898" y="265" font-size="24">ACCEPTED USE</text><text x="898" y="309" font-size="20">Receiver confirms</text><text x="898" y="343" font-size="20">the promised object</text>
<g stroke="#567362" stroke-width="3" fill="none"><path d="M320 300H387m-14-10 14 10-14 10"/><path d="M785 300H852m-14-10 14 10-14 10"/><path d="M588 400V462H185V404m-10 14 10-14 10 14"/></g>
<text x="350" y="505" font-size="21">Unresolved work keeps a named owner</text><path d="M60 552H1140" stroke="#c8c3b8"/>
<text x="60" y="599" font-size="22">Measure accepted outcomes and receiver minutes together.</text></g></svg>
