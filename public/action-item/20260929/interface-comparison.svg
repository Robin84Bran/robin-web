<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc"><title id="title">Two ways to compare an agent</title><desc id="desc">The buyer compares complete configurations for a defined workload. The builder holds conditions fixed and changes a single component. Both use explicit final-state acceptance and cost per accepted outcome. Conceptual proposal, no experiment performed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#80705d" stroke-width="1.5"/></marker></defs><rect width="1200" height="860" fill="#f5f2ec"/><g font-family="Arial,sans-serif" fill="#302e2a"><text x="60" y="57" font-size="16" letter-spacing="3">IAMROBIN.AI / AGENT EVALUATION</text><text x="60" y="119" font-family="Georgia,serif" font-size="43">Who shortened the corridor?</text><text x="60" y="163" font-size="22" fill="#69645d">One business outcome. Two different questions.</text><rect x="60" y="211" width="515" height="290" rx="8" fill="#e7dccb"/><text x="88" y="257" font-size="25">BUYER / WHICH SYSTEM?</text><text x="88" y="307" font-size="22">Compare complete configurations</text><text x="88" y="357" font-size="20">Model + interface + integration</text><text x="88" y="397" font-size="20">Same business authority and workload</text><text x="88" y="451" font-size="20">Count operation and review costs</text><rect x="625" y="211" width="515" height="290" rx="8" fill="#e2e6df"/><text x="653" y="257" font-size="25">BUILDER / WHAT CHANGED?</text><text x="653" y="307" font-size="22">Change one component at a time</text><text x="653" y="357" font-size="20">Fixed model → compare interfaces</text><text x="653" y="397" font-size="20">Fixed interface → compare models</text><text x="653" y="451" font-size="20">Match state, tasks and evaluator</text><path d="M317 501V559M882 501V559" stroke="#80705d" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="574" width="1080" height="140" rx="8" fill="#fffdfa" stroke="#b6a894"/><text x="88" y="618" font-size="25">ACCEPT THE RESULT IN THE APPLICATION</text><text x="88" y="661" font-size="21">Correct final state · protected fields unchanged · independently checked</text><text x="88" y="694" font-size="20">Report partial progress separately. Divide total cost by accepted outcomes.</text><text x="60" y="771" font-size="20" fill="#69645d">Author-designed framework informed by five primary research sources.</text><text x="60" y="811" font-size="20" fill="#69645d">Proposed evaluation only. No measured model advantage is claimed.</text></g></svg>