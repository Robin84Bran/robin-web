<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">OpenAI gives medical search a dedicated reading room</title>
  <desc id="desc">A restrained diagram of a medical index leading to source checking and an empty ten-case scorecard.</desc>
  <rect width="1600" height="900" fill="#f4f0e8"/>
  <g stroke="#18332f" fill="none" stroke-width="3">
    <path d="M160 255H585"/><path d="M1015 255H1440"/><path d="M800 390V650"/>
    <rect x="585" y="140" width="430" height="250" rx="6" fill="#fffdf7"/>
    <rect x="275" y="650" width="1050" height="95" rx="4" fill="#e6ded0"/>
    <path d="M380 650V745M485 650V745M590 650V745M695 650V745M800 650V745M905 650V745M1010 650V745M1115 650V745M1220 650V745"/>
  </g>
  <g fill="#18332f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="160" y="235" font-size="28">THE WHOLE WEB</text>
    <text x="1100" y="235" font-size="28">ORIGINAL SOURCES</text>
    <text x="645" y="225" font-size="30">MEDICAL INDEX</text>
    <text x="645" y="275" font-size="21">a dedicated reading room</text>
    <text x="654" y="326" font-size="18">SEARCH → READ → CITE</text>
    <text x="275" y="625" font-size="24">TEN BLINDED CASES</text>
    <text x="294" y="710" font-size="22">?</text><text x="399" y="710" font-size="22">?</text><text x="504" y="710" font-size="22">?</text><text x="609" y="710" font-size="22">?</text><text x="714" y="710" font-size="22">?</text><text x="819" y="710" font-size="22">?</text><text x="924" y="710" font-size="22">?</text><text x="1029" y="710" font-size="22">?</text><text x="1134" y="710" font-size="22">?</text><text x="1239" y="710" font-size="22">?</text>
  </g>
  <text x="160" y="110" fill="#a4492f" font-family="Georgia, serif" font-size="54">The shelf changed.</text>
  <text x="160" y="820" fill="#18332f" font-family="Georgia, serif" font-size="38">The scorecard is still empty.</text>
</svg>
