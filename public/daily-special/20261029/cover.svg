<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Seventy-five trucks, six verbs</title>
  <desc id="desc">A quiet editorial diagram moves one autonomous truck through contracted, delivered, authorized, dispatched, paid and repeated stages.</desc>
  <rect width="1600" height="900" fill="#f4f0e8"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#202a28">
    <text x="112" y="104" font-size="22" letter-spacing="5">DAILY SPECIAL · 29 OCTOBER 2026</text>
    <text x="112" y="212" font-size="68" font-weight="600">Seventy-five trucks.</text>
    <text x="112" y="294" font-size="68" font-weight="600">Six verbs.</text>
    <text x="112" y="356" font-size="25" fill="#657068">The contract is real. The operating receipt comes next.</text>

    <g transform="translate(112 486)">
      <line x1="84" y1="84" x2="1278" y2="84" stroke="#c8cec6" stroke-width="8" stroke-linecap="round"/>
      <g transform="translate(0 0)">
        <rect x="0" y="32" width="168" height="88" rx="18" fill="#345d70"/>
        <rect x="110" y="2" width="76" height="68" rx="12" fill="#345d70"/>
        <circle cx="42" cy="128" r="27" fill="#202a28"/>
        <circle cx="142" cy="128" r="27" fill="#202a28"/>
        <path d="M126 18h38l16 30h-54z" fill="#d8a64b"/>
      </g>
      <g font-size="17" letter-spacing="2" text-anchor="middle">
        <g transform="translate(90 212)"><circle cy="-128" r="12" fill="#9a594f"/><text y="0">CONTRACTED</text><text y="32" fill="#657068">PUBLIC</text></g>
        <g transform="translate(332 212)"><circle cy="-128" r="12" fill="#d8a64b"/><text y="0">DELIVERED</text><text y="32" fill="#657068">NOT DISCLOSED</text></g>
        <g transform="translate(574 212)"><circle cy="-128" r="12" fill="#d8a64b"/><text y="0">AUTHORIZED</text><text y="32" fill="#657068">NOT ESTABLISHED</text></g>
        <g transform="translate(816 212)"><circle cy="-128" r="12" fill="#d8a64b"/><text y="0">DISPATCHED</text><text y="32" fill="#657068">NOT DISCLOSED</text></g>
        <g transform="translate(1058 212)"><circle cy="-128" r="12" fill="#d8a64b"/><text y="0">PAID</text><text y="32" fill="#657068">PRICE UNKNOWN</text></g>
        <g transform="translate(1300 212)"><circle cy="-128" r="12" fill="#d8a64b"/><text y="0">REPEATED</text><text y="32" fill="#657068">STILL AHEAD</text></g>
      </g>
    </g>

    <line x1="112" y1="792" x2="1488" y2="792" stroke="#c8cec6" stroke-width="3"/>
    <text x="112" y="842" font-size="21" fill="#657068">Public-source research · watch each truck change tense</text>
  </g>
</svg>
