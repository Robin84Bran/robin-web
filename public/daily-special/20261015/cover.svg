<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Twenty years of power, four blank boxes</title>
  <desc id="desc">A twenty-year power purchase agreement runs above four project-risk boxes for delay, fuel, replacement and early exit.</desc>
  <rect width="1600" height="900" fill="#f1eee6"/>
  <g fill="none" stroke="#d9d6cd" stroke-width="1">
    <path d="M0 180H1600M0 360H1600M0 540H1600M0 720H1600"/>
    <path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/>
  </g>
  <text x="110" y="108" fill="#716c5d" font-family="Arial,sans-serif" font-size="23" letter-spacing="4">DAILY SPECIAL · 15 OCT 2026 · SIGNAL 6</text>
  <text x="110" y="218" fill="#25251f" font-family="Georgia,serif" font-size="66">Twenty years of power.</text>
  <text x="110" y="298" fill="#25251f" font-family="Georgia,serif" font-size="66">Four blank boxes.</text>

  <g>
    <rect x="110" y="386" width="1380" height="92" rx="8" fill="#59634f"/>
    <text x="150" y="424" fill="#f7f4eb" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">20-YEAR PPA · 702 MW · NAMED BUYER</text>
    <text x="1450" y="444" fill="#f7f4eb" font-family="Georgia,serif" font-size="31" text-anchor="end">Duration gives the project a horizon.</text>
  </g>

  <g fill="#f8f6f0" stroke="#8c805f" stroke-width="2">
    <rect x="110" y="548" width="310" height="178" rx="8"/>
    <rect x="466" y="548" width="310" height="178" rx="8"/>
    <rect x="822" y="548" width="310" height="178" rx="8"/>
    <rect x="1178" y="548" width="310" height="178" rx="8"/>
  </g>
  <g fill="#2f332b" font-family="Arial,sans-serif">
    <text x="140" y="590" font-size="17" letter-spacing="3">01 · DELAY</text>
    <text x="140" y="646" font-family="Georgia,serif" font-size="29">What if 2028</text>
    <text x="140" y="684" font-family="Georgia,serif" font-size="29">arrives first?</text>
    <text x="496" y="590" font-size="17" letter-spacing="3">02 · FUEL</text>
    <text x="496" y="646" font-family="Georgia,serif" font-size="29">Who carries</text>
    <text x="496" y="684" font-family="Georgia,serif" font-size="29">the gas price?</text>
    <text x="852" y="590" font-size="17" letter-spacing="3">03 · STACKS</text>
    <text x="852" y="646" font-family="Georgia,serif" font-size="29">Who pays for</text>
    <text x="852" y="684" font-family="Georgia,serif" font-size="29">replacement?</text>
    <text x="1208" y="590" font-size="17" letter-spacing="3">04 · EXIT</text>
    <text x="1208" y="646" font-family="Georgia,serif" font-size="29">What survives</text>
    <text x="1208" y="684" font-family="Georgia,serif" font-size="29">an early end?</text>
  </g>
  <g fill="#9b7257">
    <circle cx="265" cy="518" r="6"/><circle cx="621" cy="518" r="6"/><circle cx="977" cy="518" r="6"/><circle cx="1333" cy="518" r="6"/>
  </g>
  <g stroke="#9b7257" stroke-width="2" stroke-dasharray="7 8">
    <path d="M265 478V548"/><path d="M621 478V548"/><path d="M977 478V548"/><path d="M1333 478V548"/>
  </g>
  <text x="110" y="822" fill="#575d50" font-family="Arial,sans-serif" font-size="22">A long contract organizes risk. The missing clauses decide who keeps it.</text>
  <text x="1488" y="822" fill="#575d50" font-family="Arial,sans-serif" font-size="20" text-anchor="end">iamrobin.ai</text>
</svg>
