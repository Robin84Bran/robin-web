<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The excavator got paid</title>
  <desc id="desc">An abstract excavator bucket meets a clock and an operating receipt, showing the evidence needed after paid autonomous work begins.</desc>
  <rect width="1600" height="900" fill="#f4f0e8"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#202a28">
    <text x="112" y="104" font-size="22" letter-spacing="5">DAILY SPECIAL · 27 OCTOBER 2026</text>
    <text x="112" y="218" font-size="66" font-weight="600">The excavator</text>
    <text x="112" y="296" font-size="66" font-weight="600">got paid.</text>
    <text x="112" y="360" font-size="25" fill="#657068">Now show me the clock, the count and the margin.</text>

    <g transform="translate(120 470)">
      <path d="M36 66h286l62 120H164L86 144H36z" fill="#d8a64b"/>
      <path d="M116 34h150l50 44H94z" fill="#bd7438"/>
      <circle cx="132" cy="190" r="34" fill="#202a28"/>
      <circle cx="290" cy="190" r="34" fill="#202a28"/>
      <path d="M320 44h126l152 86-18 31-168-65h-92z" fill="#b07a3a"/>
      <path d="M570 130l148 28-48 116-124-94z" fill="#345d70"/>
    </g>

    <g transform="translate(958 520)">
      <circle cx="180" cy="112" r="148" fill="#e8e1d6" stroke="#345d70" stroke-width="9"/>
      <circle cx="180" cy="112" r="10" fill="#345d70"/>
      <line x1="180" y1="112" x2="180" y2="26" stroke="#345d70" stroke-width="10" stroke-linecap="round"/>
      <line x1="180" y1="112" x2="250" y2="148" stroke="#9a594f" stroke-width="10" stroke-linecap="round"/>
      <text x="180" y="306" text-anchor="middle" font-size="21" letter-spacing="3">PAID HOURS</text>
    </g>

    <g transform="translate(900 424)" font-size="18" letter-spacing="2">
      <text x="0" y="0">OPERATING RECEIPT</text>
      <text x="0" y="38" fill="#657068">INTERVENTIONS / 100 H</text>
      <text x="560" y="38" text-anchor="end" fill="#9a594f">NOT DISCLOSED</text>
    </g>

    <line x1="112" y1="792" x2="1488" y2="792" stroke="#c8cec6" stroke-width="3"/>
    <text x="112" y="842" font-size="21" fill="#657068">Public-source research · payment is evidence of willingness, not yet unit economics</text>
  </g>
</svg>
