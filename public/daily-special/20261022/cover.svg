<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The total turned green. The rails did not.</title>
  <desc id="desc">Three parallel flow rails show positive Bitcoin ETP flow, negative Ether ETP flow, and contracting stablecoin circulation.</desc>
  <rect width="1600" height="900" fill="#f4f0e8"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#202a28">
    <text x="112" y="112" font-size="22" letter-spacing="5">DAILY SPECIAL · 22 OCTOBER 2026</text>
    <text x="112" y="225" font-size="66" font-weight="600">The total turned green.</text>
    <text x="112" y="302" font-size="66" font-weight="600">The rails did not.</text>
    <text x="112" y="365" font-size="26" fill="#627068">Five complete ETP sessions · seven-day stablecoin measure</text>

    <text x="112" y="488" font-size="24" letter-spacing="2">BITCOIN ETP</text>
    <line x1="390" y1="480" x2="1370" y2="480" stroke="#c7cec5" stroke-width="18" stroke-linecap="round"/>
    <line x1="390" y1="480" x2="1025" y2="480" stroke="#3f705a" stroke-width="18" stroke-linecap="round"/>
    <circle cx="1025" cy="480" r="17" fill="#3f705a"/>
    <text x="1070" y="490" font-size="34" font-weight="600" fill="#3f705a">+$211.2m</text>

    <text x="112" y="612" font-size="24" letter-spacing="2">ETHER ETP</text>
    <line x1="390" y1="604" x2="1370" y2="604" stroke="#c7cec5" stroke-width="18" stroke-linecap="round"/>
    <line x1="390" y1="604" x2="725" y2="604" stroke="#9a594f" stroke-width="18" stroke-linecap="round"/>
    <circle cx="725" cy="604" r="17" fill="#9a594f"/>
    <text x="770" y="614" font-size="34" font-weight="600" fill="#9a594f">−$388.9m</text>

    <text x="112" y="736" font-size="24" letter-spacing="2">USD STABLECOINS</text>
    <line x1="390" y1="728" x2="1370" y2="728" stroke="#c7cec5" stroke-width="18" stroke-linecap="round"/>
    <line x1="390" y1="728" x2="655" y2="728" stroke="#9a594f" stroke-width="18" stroke-linecap="round"/>
    <circle cx="655" cy="728" r="17" fill="#9a594f"/>
    <text x="700" y="738" font-size="34" font-weight="600" fill="#9a594f">−0.77%</text>

    <text x="112" y="842" font-size="21" fill="#657068">Different clocks and meanings · compare direction, never add the rails</text>
  </g>
</svg>
