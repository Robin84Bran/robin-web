<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f4f0e8"/><g font-family="Arial, sans-serif" fill="#202a28"><text x="100" y="112" font-size="23" letter-spacing="4">DAILY SPECIAL / SEPTEMBER 27, 2026</text><text x="100" y="225" font-size="76">When aid becomes spendable</text><text x="100" y="296" font-size="29" fill="#56645d">Follow a payment to the person who needs it.</text><rect x="100" y="395" width="305" height="224" fill="#e7e7dd"/><g fill="#202a28"><text x="128" y="442" font-size="23">01</text><text x="128" y="511" font-size="38">Authorize</text><text x="128" y="570" font-size="23">Who is eligible?</text></g><path d="M418 510 h30 m-10 -10 l10 10 -10 10" fill="none" stroke="#617369" stroke-width="3"/><rect x="465" y="395" width="305" height="224" fill="#e7e7dd"/><g fill="#202a28"><text x="493" y="442" font-size="23">02</text><text x="493" y="511" font-size="38">Transfer</text><text x="493" y="570" font-size="23">Did value move?</text></g><path d="M783 510 h30 m-10 -10 l10 10 -10 10" fill="none" stroke="#617369" stroke-width="3"/><rect x="830" y="395" width="305" height="224" fill="#315d4b"/><g fill="#ffffff"><text x="858" y="442" font-size="23">03</text><text x="858" y="511" font-size="38">Use</text><text x="858" y="570" font-size="23">Can they spend it?</text></g><path d="M1148 510 h30 m-10 -10 l10 10 -10 10" fill="none" stroke="#617369" stroke-width="3"/><rect x="1195" y="395" width="305" height="224" fill="#e7e7dd"/><g fill="#202a28"><text x="1223" y="442" font-size="23">04</text><text x="1223" y="511" font-size="38">Reconcile</text><text x="1223" y="570" font-size="23">Do records match?</text></g><text x="100" y="718" font-size="29">Compare full cost, recipient access and unresolved payments.</text><path d="M100 765 H1500" stroke="#bcc5ba"/><text x="100" y="820" font-size="23" fill="#56645d">Conceptual evaluation map · No programme performance result implied</text></g></svg>