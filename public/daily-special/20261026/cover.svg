<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The alarm is not the receipt</title>
  <desc id="desc">A quiet evidence ladder separates a saved schedule, invocation delivery, terminal turn, inspected artifact and accepted outcome.</desc>
  <rect width="1600" height="900" fill="#f4f0e8"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#202a28">
    <text x="112" y="102" font-size="22" letter-spacing="5">DAILY SPECIAL · 26 OCTOBER 2026</text>
    <text x="112" y="218" font-size="68" font-weight="600">The alarm is not</text>
    <text x="112" y="298" font-size="68" font-weight="600">the receipt.</text>
    <text x="112" y="360" font-size="25" fill="#657068">Five evidence layers between a schedule and an accepted result</text>

    <line x1="190" y1="555" x2="1410" y2="555" stroke="#c8cec6" stroke-width="6"/>

    <g text-anchor="middle">
      <circle cx="190" cy="555" r="22" fill="#78847d"/>
      <text x="190" y="490" font-size="19" letter-spacing="2">SCHEDULED</text>
      <text x="190" y="618" font-size="20" fill="#657068">timing stored</text>

      <circle cx="495" cy="555" r="22" fill="#b07a3a"/>
      <text x="495" y="490" font-size="19" letter-spacing="2">INVOKED</text>
      <text x="495" y="618" font-size="20" fill="#657068">attempt recorded</text>

      <circle cx="800" cy="555" r="22" fill="#345d70"/>
      <text x="800" y="490" font-size="19" letter-spacing="2">DELIVERED</text>
      <text x="800" y="618" font-size="20" fill="#657068">session accepted</text>

      <circle cx="1105" cy="555" r="22" fill="#526a63"/>
      <text x="1105" y="490" font-size="19" letter-spacing="2">TURN ENDED</text>
      <text x="1105" y="618" font-size="20" fill="#657068">output inspected?</text>

      <circle cx="1410" cy="555" r="26" fill="#f4f0e8" stroke="#9a594f" stroke-width="7"/>
      <circle cx="1410" cy="555" r="7" fill="#9a594f"/>
      <text x="1410" y="490" font-size="19" letter-spacing="2" fill="#9a594f">ACCEPTED</text>
      <text x="1410" y="618" font-size="20" fill="#9a594f">task rule passed</text>
    </g>

    <rect x="650" y="694" width="818" height="82" rx="41" fill="#e8e1d6"/>
    <text x="1059" y="745" text-anchor="middle" font-size="27" font-weight="600">“completed” belongs to delivery, not the outcome</text>
    <text x="112" y="848" font-size="20" fill="#657068">Public-source research · no live automation or financial test was run</text>
  </g>
</svg>
