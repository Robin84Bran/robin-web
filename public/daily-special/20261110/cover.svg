<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">What Five Demonstrations Can Teach a Robot</title>
  <desc id="desc">Five small demonstration cards lead into a robot hand diagram and a bounded 95 percent benchmark result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f1e8"/>
      <stop offset="1" stop-color="#ddd8cb"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#183238" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#1e6a68"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <g fill="#183238">
    <text x="120" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" letter-spacing="5">DAILY SPECIAL · SIGNAL 2</text>
    <text x="120" y="244" font-family="Georgia, 'Times New Roman', serif" font-size="72">What five demonstrations</text>
    <text x="120" y="327" font-family="Georgia, 'Times New Roman', serif" font-size="72">can teach a robot</text>
  </g>
  <g transform="translate(120 420)">
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
      <g fill="#f5f1e8" stroke="#183238" stroke-opacity="0.32" stroke-width="2">
        <rect x="0" y="0" width="150" height="118" rx="10"/>
        <rect x="176" y="0" width="150" height="118" rx="10"/>
        <rect x="352" y="0" width="150" height="118" rx="10"/>
        <rect x="528" y="0" width="150" height="118" rx="10"/>
        <rect x="704" y="0" width="150" height="118" rx="10"/>
      </g>
      <g fill="#183238" font-size="20">
        <text x="75" y="48">DEMO 1</text><text x="75" y="79" font-size="15">TARGET ROBOT</text>
        <text x="251" y="48">DEMO 2</text><text x="251" y="79" font-size="15">TARGET ROBOT</text>
        <text x="427" y="48">DEMO 3</text><text x="427" y="79" font-size="15">TARGET ROBOT</text>
        <text x="603" y="48">DEMO 4</text><text x="603" y="79" font-size="15">TARGET ROBOT</text>
        <text x="779" y="48">DEMO 5</text><text x="779" y="79" font-size="15">TARGET ROBOT</text>
      </g>
    </g>
    <path d="M875 59H1010" stroke="#1e6a68" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g transform="translate(1050 -26)">
      <rect width="310" height="270" rx="14" fill="#183238"/>
      <text x="28" y="48" fill="#f5f1e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">DEXTER-50</text>
      <text x="28" y="132" fill="#f5f1e8" font-family="Georgia, 'Times New Roman', serif" font-size="74">95%</text>
      <text x="28" y="168" fill="#f5f1e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">REPORTED AVERAGE SUCCESS</text>
      <path d="M30 208H280" stroke="#f5f1e8" stroke-opacity="0.35"/>
      <text x="28" y="239" fill="#dfb06d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">SELECTED LEARNABLE TASK SET</text>
    </g>
    <g transform="translate(0 176)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect width="854" height="94" rx="10" fill="#1e6a68"/>
      <text x="28" y="39" fill="#f5f1e8" font-size="18">THE FIVE EPISODES WERE THE FINAL LESSON</text>
      <text x="28" y="69" fill="#f5f1e8" fill-opacity="0.86" font-size="16">AFTER LARGE-SCALE PRETRAINING · THEN ~30 MINUTES OF FINE-TUNING</text>
    </g>
  </g>
  <text x="120" y="836" fill="#183238" fill-opacity="0.72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">10 NOVEMBER 2026 · IAMROBIN.AI</text>
</svg>
