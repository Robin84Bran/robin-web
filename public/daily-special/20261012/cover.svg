<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The denominator moves the tote</title>
  <desc id="desc">A restrained comparison of five-year RaaS and ownership payments flowing through one shared successful-move denominator.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#243347"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".12" stroke="#b8c8d8" stroke-width="1">
    <path d="M0 180H1600M0 360H1600M0 540H1600M0 720H1600"/>
    <path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/>
  </g>
  <text x="120" y="130" fill="#d7e4ed" font-family="Arial, Helvetica, sans-serif" font-size="26" letter-spacing="7">DAILY SPECIAL · 12 OCTOBER 2026</text>
  <text x="120" y="245" fill="#ffffff" font-family="Georgia, serif" font-size="72">The price is not</text>
  <text x="120" y="328" fill="#ffffff" font-family="Georgia, serif" font-size="72">the denominator.</text>
  <g filter="url(#shadow)">
    <rect x="120" y="415" width="560" height="115" rx="18" fill="#f2b56b"/>
    <text x="170" y="463" fill="#2a1d12" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">RaaS · 5 YEARS</text>
    <text x="170" y="510" fill="#2a1d12" font-family="Georgia, serif" font-size="43">≈ $500,000</text>
    <rect x="120" y="560" width="448" height="115" rx="18" fill="#8bc9c1"/>
    <text x="170" y="608" fill="#102725" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">OWNERSHIP · 5 YEARS</text>
    <text x="170" y="655" fill="#102725" font-family="Georgia, serif" font-size="43">≈ $400,000</text>
  </g>
  <path d="M735 500H935" stroke="#e8eef3" stroke-width="4" stroke-linecap="round"/>
  <path d="M910 478L938 500L910 522" fill="none" stroke="#e8eef3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="970" y="407" width="510" height="280" rx="26" fill="#f7f5ef" filter="url(#shadow)"/>
  <text x="1025" y="472" fill="#233247" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="3">ONE SHARED DENOMINATOR</text>
  <text x="1025" y="542" fill="#152338" font-family="Georgia, serif" font-size="39">successful tote moves</text>
  <text x="1025" y="596" fill="#526272" font-family="Arial, Helvetica, sans-serif" font-size="25">after utilization, failure</text>
  <text x="1025" y="632" fill="#526272" font-family="Arial, Helvetica, sans-serif" font-size="25">and human recovery</text>
  <text x="120" y="810" fill="#aebdca" font-family="Arial, Helvetica, sans-serif" font-size="27">A scenario card, not a procurement decision.</text>
  <text x="1480" y="810" fill="#d7e4ed" text-anchor="end" font-family="Georgia, serif" font-size="28">iamrobin.ai</text>
</svg>
