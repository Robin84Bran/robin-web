<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">When does the AI factory clock start?</title>
  <desc id="desc">A quiet timeline from contract through site work to a running workload.</desc>
  <rect width="1600" height="900" fill="#f3f0e8"/>
  <path d="M0 140H1600M0 450H1600M0 760H1600" stroke="#d8d3c7" stroke-width="1"/>
  <path d="M180 0V900M800 0V900M1420 0V900" stroke="#d8d3c7" stroke-width="1"/>
  <text x="180" y="170" fill="#857d70" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="5">DAILY SPECIAL · SIGNAL 6</text>
  <text x="180" y="290" fill="#171716" font-family="Georgia, Times New Roman, serif" font-size="78">When does the</text>
  <text x="180" y="382" fill="#171716" font-family="Georgia, Times New Roman, serif" font-size="78">AI factory clock start?</text>
  <line x1="260" y1="590" x2="1340" y2="590" stroke="#252522" stroke-width="3"/>
  <circle cx="260" cy="590" r="14" fill="#6b5cff"/>
  <circle cx="800" cy="590" r="14" fill="#f0a34a"/>
  <circle cx="1340" cy="590" r="14" fill="#23936f"/>
  <text x="260" y="646" text-anchor="middle" fill="#393733" font-family="Arial, Helvetica, sans-serif" font-size="25">CONTRACT</text>
  <text x="800" y="646" text-anchor="middle" fill="#393733" font-family="Arial, Helvetica, sans-serif" font-size="25">SITE WORK</text>
  <text x="1340" y="646" text-anchor="middle" fill="#393733" font-family="Arial, Helvetica, sans-serif" font-size="25">RUNNING WORKLOAD</text>
  <text x="800" y="728" text-anchor="middle" fill="#171716" font-family="Georgia, Times New Roman, serif" font-size="38">12–16 weeks needs two dated endpoints.</text>
  <text x="1420" y="835" text-anchor="end" fill="#857d70" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="3">IAMROBIN.AI · 12 NOV 2026</text>
</svg>
