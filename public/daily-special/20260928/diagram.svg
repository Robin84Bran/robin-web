<g font-family="Arial, sans-serif"><text x="744" y="245" fill="#596866" font-size="14" letter-spacing="2">PROPOSED COMPARISON</text><g fill="#19343b" font-size="21"><text x="744" y="294">A / Joint policy</text><text x="744" y="346">B / Explicit roles</text><text x="744" y="398">C / Role information removed</text></g><path d="M744 424H1118" stroke="#19343b" stroke-opacity=".18"/><g fill="#596866" font-size="17"><text x="744" y="456">Same task, data and compute budget</text><text x="744" y="487">Count completion, collisions and help</text></g></g>
