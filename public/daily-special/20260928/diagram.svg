<rect width="1200" height="630" fill="#f5f2e9"/><rect width="1200" height="630" fill="url(#grid)"/>
<g fill="#19343b" font-family="Arial, sans-serif"><text x="66" y="60" font-size="15" letter-spacing="3">DAILY SPECIAL / 28 SEPTEMBER 2026</text><text x="66" y="126" font-family="Georgia, serif" font-size="49">Two arms, one jar</text><text x="66" y="168" font-size="20" fill="#596866">Does an explicit division of labor earn its cost?</text></g>
<g stroke="#19343b" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M111 457V398L188 341L304 368"/><circle cx="188" cy="341" r="13" fill="#f5f2e9"/><path d="M305 349V394M305 349H330M305 394H330"/><path d="M610 457V295L540 251L426 277"/><circle cx="540" cy="251" r="13" fill="#f5f2e9"/><path d="M426 263V291M426 263H404M426 291H404"/></g>
