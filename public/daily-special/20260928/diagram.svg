<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Two arms, one jar</title><desc id="desc">Conceptual diagram of one gripper stabilizing a jar while the other turns its lid. A proposed comparison holds the task, data and compute budget common while testing joint control, explicit roles and a role ablation. No experimental results are shown.</desc>
