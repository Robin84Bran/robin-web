<path d="M90 460H630" stroke="#19343b" stroke-width="2" stroke-opacity=".4"/>
<g font-family="Arial, sans-serif" font-size="17"><text x="108" y="499" fill="#326356">STABILIZE THE JAR</text><text x="444" y="499" fill="#aa5c47">TURN THE LID</text></g>
