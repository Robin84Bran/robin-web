<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">When an AI resolution stays resolved</title>
  <desc id="desc">A calm editorial flow follows eligible cases through initial resolution, a durability window, and contribution profit per lasting resolution.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f0e7"/><stop offset="1" stop-color="#e1d6c5"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#173038" stroke-opacity=".06"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#172b31" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#paper)"/><rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="92" y="82" width="1416" height="736" rx="20" fill="#faf8f3" stroke="#20383e" stroke-opacity=".18" filter="url(#shadow)"/>
  <text x="160" y="150" fill="#a85136" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="4">DAILY SPECIAL · SIGNAL 7</text>
  <text x="160" y="226" fill="#162a30" font-family="Georgia,'Times New Roman',serif" font-size="62">When a resolution stays resolved</text>
  <text x="160" y="270" fill="#53676b" font-family="Arial,Helvetica,sans-serif" font-size="22">Follow the same cases through the customer, contract, and cost ledgers.</text>
  <g transform="translate(160 360)">
    <path d="M235 102h90M555 102h90M875 102h90" stroke="#a85136" stroke-width="5" stroke-dasharray="5 14" stroke-linecap="round"/>
    <g>
      <rect width="235" height="205" rx="18" fill="#edf0e8" stroke="#244047" stroke-width="3"/>
      <circle cx="50" cy="50" r="22" fill="#d6a15d"/><path d="M88 44h96M88 66h72" stroke="#244047" stroke-width="7" stroke-linecap="round"/>
      <text x="28" y="130" fill="#162a30" font-family="Georgia,'Times New Roman',serif" font-size="25">Eligible cases</text>
      <text x="28" y="166" fill="#607174" font-family="Arial,Helvetica,sans-serif" font-size="15">Fixed task and denominator</text>
    </g>
    <g transform="translate(325)">
      <rect width="235" height="205" rx="18" fill="#e4ece7" stroke="#244047" stroke-width="3"/>
      <circle cx="50" cy="50" r="22" fill="#5e8e83"/><path d="M40 50l7 8 15-18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="130" fill="#162a30" font-family="Georgia,'Times New Roman',serif" font-size="23">Initially resolved</text>
      <text x="28" y="166" fill="#607174" font-family="Arial,Helvetica,sans-serif" font-size="15">Contract rule at close</text>
    </g>
    <g transform="translate(650)">
      <rect width="235" height="205" rx="18" fill="#dce9e5" stroke="#244047" stroke-width="3"/>
      <circle cx="50" cy="50" r="22" fill="#3d746d"/><path d="M50 37v15l11 7" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <text x="28" y="122" fill="#162a30" font-family="Georgia,'Times New Roman',serif" font-size="24">Lasting</text>
      <text x="28" y="151" fill="#162a30" font-family="Georgia,'Times New Roman',serif" font-size="24">resolution</text>
      <text x="28" y="180" fill="#607174" font-family="Arial,Helvetica,sans-serif" font-size="14">Still solved after the window</text>
    </g>
    <g transform="translate(975)">
      <rect width="235" height="205" rx="18" fill="#eee2cf" stroke="#244047" stroke-width="3"/>
      <circle cx="50" cy="50" r="22" fill="#a85136"/><path d="M39 55c12 7 24 2 24-7s-15-10-21-5c-7 6 1 13 19 13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="28" y="122" fill="#162a30" font-family="Georgia,'Times New Roman',serif" font-size="22">Contribution profit</text>
      <text x="28" y="151" fill="#162a30" font-family="Georgia,'Times New Roman',serif" font-size="22">per lasting result</text>
      <text x="28" y="180" fill="#607174" font-family="Arial,Helvetica,sans-serif" font-size="14">Retained fees less variable work</text>
    </g>
    <g transform="translate(0 270)">
      <rect width="1210" height="96" rx="16" fill="#162a30"/>
      <text x="48" y="40" fill="#e8d8bd" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="3">ONE COHORT · THREE LEDGERS</text>
      <text x="48" y="72" fill="#fff8eb" font-family="Georgia,'Times New Roman',serif" font-size="24">Did the issue stay solved? Was the fee retained? What did every attempt cost?</text>
    </g>
  </g>
  <text x="160" y="786" fill="#5b6d70" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="2">A CLOSED CHAT IS A MILESTONE · DURABLE UNIT ECONOMICS FOLLOW THE CASE THROUGH TIME</text>
</svg>
