<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f4f1e9"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#0b1228" stroke-width="1.5"/></marker></defs><g fill="#0b1228" font-family="Arial, sans-serif"><text x="100" y="100" font-size="23" letter-spacing="5">BINARY / INVEST</text><text x="100" y="205" font-size="72" font-family="Georgia, serif">When the badge becomes common</text><text x="100" y="275" font-size="30">A conditional mechanism, not an observed market outcome</text><rect x="100" y="385" width="400" height="205" rx="3" fill="#61d4d7"/><text x="132" y="453" font-size="31">SAME PERMISSION</text><text x="132" y="515" font-size="29">Same narrowly defined job</text><path d="M510,485 L580,485" stroke="#0b1228" stroke-width="4" marker-end="url(#a)"/><rect x="600" y="385" width="380" height="205" fill="#e8e4d9"/><text x="637" y="453" font-size="31">REAL ALTERNATIVES</text><text x="637" y="515" font-size="29">Can the customer switch?</text><path d="M990,485 L1060,485" stroke="#0b1228" stroke-width="4" marker-end="url(#a)"/><rect x="1080" y="385" width="420" height="205" fill="#d8b86b"/><text x="1117" y="453" font-size="31">SERVICE COMPARISON</text><text x="1117" y="515" font-size="29">What earns the next invoice?</text><text x="100" y="702" font-size="29">Entry restrictions or difficult migration can interrupt this path.</text><text x="100" y="763" font-size="26">No fee premium, profit or court outcome is established here.</text><text x="1500" y="861" font-size="21" text-anchor="end">IAmRobin.ai</text></g></svg>