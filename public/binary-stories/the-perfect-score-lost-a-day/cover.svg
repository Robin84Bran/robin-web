<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">The perfect score lost a day</title>
  <desc id="desc">An illustrative reliability funnel from thirty expected occurrences to twenty-nine invocations and twenty-eight accepted outputs.</desc>
  <rect width="1200" height="675" fill="#0B1228"/>
  <path d="M0 536 C210 498 350 596 566 541 C765 490 957 536 1200 456 L1200 675 L0 675 Z" fill="#101C3A"/>
  <text x="72" y="78" fill="#61D4D7" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">BINARY / BUILD · ILLUSTRATION</text>
  <text x="72" y="153" fill="#F4F1E9" font-family="Georgia, serif" font-size="56" font-weight="700">The perfect score</text>
  <text x="72" y="218" fill="#F4F1E9" font-family="Georgia, serif" font-size="56" font-weight="700">lost a day.</text>
  <text x="72" y="266" fill="#AAB5C8" font-family="Arial, sans-serif" font-size="22">If the missing run never enters the table, it never enters the rate.</text>
  <g transform="translate(72 334)">
    <rect x="0" y="0" width="294" height="166" rx="10" fill="#F4F1E9"/>
    <text x="24" y="34" fill="#536079" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">DELIVERY DASHBOARD</text>
    <text x="24" y="102" fill="#0B1228" font-family="Georgia, serif" font-size="58" font-weight="700">100%</text>
    <text x="24" y="139" fill="#536079" font-family="Arial, sans-serif" font-size="19">29 delivered / 29 recorded</text>
  </g>
  <path d="M387 417 H467" stroke="#61D4D7" stroke-width="4"/>
  <path d="M453 405 L469 417 L453 429" fill="none" stroke="#61D4D7" stroke-width="4"/>
  <g transform="translate(490 334)">
    <rect x="0" y="0" width="294" height="166" rx="10" fill="#F4F1E9"/>
    <text x="24" y="34" fill="#536079" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">SCHEDULE LEDGER</text>
    <text x="24" y="102" fill="#0B1228" font-family="Georgia, serif" font-size="58" font-weight="700">93.3%</text>
    <text x="24" y="139" fill="#536079" font-family="Arial, sans-serif" font-size="19">28 accepted / 30 expected</text>
  </g>
  <g transform="translate(827 332)">
    <circle cx="34" cy="34" r="26" fill="none" stroke="#D8B86B" stroke-width="5" stroke-dasharray="7 6"/>
    <text x="74" y="29" fill="#D8B86B" font-family="Arial, sans-serif" font-size="17" font-weight="700">ONE MISSING</text>
    <text x="74" y="53" fill="#AAB5C8" font-family="Arial, sans-serif" font-size="17">occurrence sits outside</text>
    <text x="74" y="76" fill="#AAB5C8" font-family="Arial, sans-serif" font-size="17">the first denominator.</text>
  </g>
  <text x="72" y="618" fill="#D8B86B" font-family="Arial, sans-serif" font-size="19" font-weight="700">EXPECTED → INVOKED → DELIVERED → FINISHED → ACCEPTED</text>
  <text x="1128" y="631" text-anchor="end" fill="#F4F1E9" font-family="Arial, sans-serif" font-size="17">IAmRobin.ai</text>
</svg>
