<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The model looked twice. The page can still be wrong.</title>
  <desc id="desc">Three nested loops separate model iteration, browser tool use and independent acceptance, with the acceptance receipt outside the agent.</desc>
  <rect width="1600" height="900" fill="#0B1228"/>
  <circle cx="1410" cy="70" r="310" fill="#14213D"/>
  <circle cx="1530" cy="830" r="360" fill="#101B34"/>
  <text x="104" y="100" fill="#61D4D7" font-family="Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="4">BINARY / BUILD</text>
  <text x="104" y="182" fill="#F4F1E9" font-family="Georgia, serif" font-size="70" font-weight="700">The model looked twice.</text>
  <text x="104" y="264" fill="#F4F1E9" font-family="Georgia, serif" font-size="70" font-weight="700">The page can still be wrong.</text>
  <text x="106" y="322" fill="#B7C2D9" font-family="Arial, sans-serif" font-size="25">Internal reasoning, browser action and verified acceptance are three different loops.</text>
  <g font-family="Arial, sans-serif">
    <rect x="112" y="405" width="362" height="206" rx="103" fill="none" stroke="#61D4D7" stroke-width="8"/>
    <path d="M390 419 l34 -7 -12 32" fill="none" stroke="#61D4D7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="293" y="482" text-anchor="middle" fill="#61D4D7" font-size="20" font-weight="700" letter-spacing="2">MODEL LOOP</text>
    <text x="293" y="526" text-anchor="middle" fill="#F4F1E9" font-size="30" font-weight="700">28 layers × 2</text>
    <text x="293" y="564" text-anchor="middle" fill="#8F9BB3" font-size="21">internal iteration</text>
    <path d="M486 508 H558" stroke="#61D4D7" stroke-width="7"/>
    <path d="M540 490 L562 508 L540 526" fill="none" stroke="#61D4D7" stroke-width="7"/>
    <rect x="576" y="405" width="362" height="206" rx="103" fill="none" stroke="#D8B86B" stroke-width="8"/>
    <path d="M854 419 l34 -7 -12 32" fill="none" stroke="#D8B86B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="757" y="482" text-anchor="middle" fill="#D8B86B" font-size="20" font-weight="700" letter-spacing="2">TOOL LOOP</text>
    <text x="757" y="526" text-anchor="middle" fill="#F4F1E9" font-size="30" font-weight="700">inspect → edit</text>
    <text x="757" y="564" text-anchor="middle" fill="#8F9BB3" font-size="21">browser reopens</text>
    <path d="M950 508 H1022" stroke="#D8B86B" stroke-width="7"/>
    <path d="M1004 490 L1026 508 L1004 526" fill="none" stroke="#D8B86B" stroke-width="7"/>
    <rect x="1040" y="391" width="446" height="234" rx="28" fill="#F4F1E9"/>
    <text x="1078" y="444" fill="#516078" font-size="20" font-weight="700" letter-spacing="2">RESULT LOOP</text>
    <text x="1078" y="496" fill="#0B1228" font-size="31" font-weight="700">Test against the frozen rules</text>
    <text x="1078" y="542" fill="#516078" font-size="22">failure → revise → retest</text>
    <rect x="1078" y="570" width="246" height="40" rx="20" fill="#D8B86B"/>
    <text x="1201" y="597" text-anchor="middle" fill="#0B1228" font-size="18" font-weight="700">INDEPENDENT RECEIPT</text>
  </g>
  <rect x="104" y="695" width="1382" height="2" fill="#2D3A58"/>
  <text x="104" y="759" fill="#F4F1E9" font-family="Georgia, serif" font-size="34">The agent can say “done.” Only the result can prove it.</text>
  <text x="104" y="816" fill="#8F9BB3" font-family="Arial, sans-serif" font-size="22">Official Z.ai documentation + proposed six-defect test · 28 NOV 2026</text>
  <text x="1367" y="824" fill="#F4F1E9" font-family="Arial, sans-serif" font-size="24" font-weight="700">IAmRobin.ai</text>
</svg>
