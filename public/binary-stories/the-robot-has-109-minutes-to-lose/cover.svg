<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The robot has 109 minutes to lose</title>
  <desc id="desc">A 24-hour shift bar separates a 20-hour productive-work floor, two hours and eleven minutes of ideal charging, and a 109-minute envelope for every other loss.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071126"/>
      <stop offset="1" stop-color="#111d38"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#23314e" stroke-width="1" opacity=".42"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="104" y="104" fill="#61d4d7" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5">BINARY / BUILD</text>
  <text x="104" y="186" fill="#f4f1e9" font-family="Georgia, serif" font-size="68" font-weight="700">The robot has 109 minutes to lose.</text>
  <text x="104" y="242" fill="#aab5cc" font-family="Arial, sans-serif" font-size="27">Fast charging starts the shift test. It does not finish it.</text>

  <g font-family="Arial, sans-serif">
    <text x="104" y="338" fill="#aab5cc" font-size="21" font-weight="700" letter-spacing="3">ILLUSTRATIVE 24-HOUR BUDGET AT A 20-HOUR PRODUCTIVE FLOOR</text>
    <rect x="104" y="385" width="1388" height="130" rx="24" fill="#17213a" stroke="#35425f" stroke-width="2"/>
    <path d="M128 385h1133v130H128a24 24 0 0 1-24-24v-82a24 24 0 0 1 24-24z" fill="#61d4d7" opacity=".82"/>
    <rect x="1261" y="385" width="126" height="130" fill="#4d5d7e"/>
    <path d="M1387 385h81a24 24 0 0 1 24 24v82a24 24 0 0 1-24 24h-81z" fill="#d8b86b"/>
    <line x1="1261" y1="385" x2="1261" y2="515" stroke="#071126" stroke-width="3"/>
    <line x1="1387" y1="385" x2="1387" y2="515" stroke="#071126" stroke-width="3"/>

    <text x="682" y="438" fill="#071126" font-size="26" font-weight="700" text-anchor="middle">PRODUCTIVE WORK FLOOR</text>
    <text x="682" y="485" fill="#071126" font-size="43" font-weight="700" text-anchor="middle">20 HOURS</text>
    <text x="1324" y="432" fill="#f4f1e9" font-size="18" font-weight="700" text-anchor="middle">IDEAL</text>
    <text x="1324" y="460" fill="#f4f1e9" font-size="18" font-weight="700" text-anchor="middle">CHARGE</text>
    <text x="1324" y="491" fill="#f4f1e9" font-size="22" font-weight="700" text-anchor="middle">2h 11m</text>
    <text x="1439" y="426" fill="#071126" font-size="17" font-weight="700" text-anchor="middle">EVERY</text>
    <text x="1439" y="450" fill="#071126" font-size="17" font-weight="700" text-anchor="middle">OTHER</text>
    <text x="1439" y="478" fill="#071126" font-size="17" font-weight="700" text-anchor="middle">LOSS</text>

    <path d="M1439 535v76" stroke="#d8b86b" stroke-width="4"/>
    <path d="M1427 597l12 16 12-16" fill="none" stroke="#d8b86b" stroke-width="4"/>
    <text x="1439" y="667" fill="#d8b86b" font-size="66" font-weight="700" text-anchor="middle">109</text>
    <text x="1439" y="705" fill="#f4f1e9" font-size="24" font-weight="700" text-anchor="middle">MINUTES</text>

    <rect x="104" y="575" width="1120" height="156" rx="22" fill="#101d38" stroke="#2c3b59" stroke-width="2"/>
    <text x="144" y="620" fill="#61d4d7" font-size="19" font-weight="700" letter-spacing="3">THE ENVELOPE MUST ABSORB</text>
    <text x="144" y="670" fill="#f4f1e9" font-size="26">Docking · charger queues · cooling · blocked paths</text>
    <text x="144" y="710" fill="#f4f1e9" font-size="26">service · faults · intervention · rejected work</text>
  </g>

  <line x1="104" y1="776" x2="1492" y2="776" stroke="#2b3854" stroke-width="2"/>
  <text x="104" y="826" fill="#aab5cc" font-family="Arial, sans-serif" font-size="20">Derived from announced 90-minute runtime / 9-minute recharge targets · not an observed customer shift</text>
  <text x="1492" y="826" fill="#f4f1e9" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="end">IAmRobin.ai</text>
</svg>
