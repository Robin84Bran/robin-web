<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Twenty years is not the protection</title>
  <desc id="desc">A twenty-year power purchase agreement sits above four unpublished contract clauses: delay, fuel, replacement and exit.</desc>
  <rect width="1600" height="900" fill="#f4f1e9"/>
  <g fill="#0b1228" font-family="Arial, sans-serif">
    <text x="88" y="82" font-size="23" letter-spacing="4">BINARY / INVEST</text>
    <text x="88" y="182" font-size="78" font-family="Georgia, serif">Twenty years is not the protection.</text>
    <text x="88" y="246" font-size="28">Duration creates the horizon. Clauses route the downside.</text>

    <rect x="88" y="316" width="1424" height="128" rx="6" fill="#61d4d7"/>
    <text x="126" y="368" font-size="21" letter-spacing="3">20-YEAR PPA</text>
    <text x="126" y="416" font-size="36">Named buyer · 100% output · revenue horizon</text>

    <g stroke="#0b1228" stroke-width="3" stroke-dasharray="10 9">
      <line x1="258" y1="444" x2="258" y2="518"/>
      <line x1="620" y1="444" x2="620" y2="518"/>
      <line x1="982" y1="444" x2="982" y2="518"/>
      <line x1="1344" y1="444" x2="1344" y2="518"/>
    </g>

    <g>
      <rect x="88" y="518" width="340" height="180" rx="6" fill="#e4dfd4"/>
      <text x="120" y="572" font-size="20" letter-spacing="3">01</text>
      <text x="120" y="625" font-size="39">DELAY</text>
      <text x="120" y="669" font-size="20">WHO FINANCES THE WAIT?</text>

      <rect x="450" y="518" width="340" height="180" rx="6" fill="#d8b86b"/>
      <text x="482" y="572" font-size="20" letter-spacing="3">02</text>
      <text x="482" y="625" font-size="39">FUEL</text>
      <text x="482" y="669" font-size="20">WHO ABSORBS THE INDEX?</text>

      <rect x="812" y="518" width="340" height="180" rx="6" fill="#e4dfd4"/>
      <text x="844" y="572" font-size="20" letter-spacing="3">03</text>
      <text x="844" y="625" font-size="39">REPLACEMENT</text>
      <text x="844" y="669" font-size="20">WHO PAYS AFTER SERVICE?</text>

      <rect x="1174" y="518" width="338" height="180" rx="6" fill="#0b1228"/>
      <g fill="#f4f1e9">
        <text x="1206" y="572" font-size="20" letter-spacing="3">04</text>
        <text x="1206" y="625" font-size="39">EXIT</text>
        <text x="1206" y="669" font-size="20">WHO OWNS THE BAD YEAR?</text>
      </g>
    </g>

    <text x="88" y="777" font-size="34" font-family="Georgia, serif">Four private clauses can move the economics.</text>
    <text x="88" y="828" font-size="20">Public-evidence risk map · No valuation or trade recommendation</text>
    <text x="1512" y="858" font-size="22" text-anchor="end">IAmRobin.ai</text>
  </g>
</svg>
