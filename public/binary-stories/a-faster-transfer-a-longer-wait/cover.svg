<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f4f1e9"/><g font-family="Arial, sans-serif" fill="#0b1228"><text x="100" y="115" font-size="23" letter-spacing="5">BINARY / BUILD</text><text x="100" y="220" font-family="Georgia, serif" font-size="69">A faster transfer, a longer wait.</text><text x="100" y="285" font-size="28" fill="#52616b">An invented race / same start and intended amount</text><rect x="100" y="345" width="1400" height="350" rx="8" fill="#0b1228"/><text x="145" y="422" font-size="30" fill="#f4f1e9">A</text><rect x="205" y="385" width="9" height="65" fill="#61d4d7"/><rect x="214" y="385" width="1080" height="65" fill="#d8b86b"/><text x="1320" y="426" font-size="30" fill="#f4f1e9">121 min</text><text x="205" y="494" font-size="26" fill="#f4f1e9">1 minute transfer + 120 minutes remaining wait</text><text x="145" y="573" font-size="30" fill="#f4f1e9">B</text><rect x="205" y="537" width="270" height="65" fill="#61d4d7"/><text x="505" y="579" font-size="30" fill="#f4f1e9">30 min</text><text x="205" y="647" font-size="26" fill="#f4f1e9">30 minutes transfer + 0 minutes remaining wait</text><text x="100" y="765" font-size="29">Measure until the money can be used.</text><text x="100" y="821" font-size="23" fill="#52616b">Hypothetical minutes, not pilot data. Fees and other differences excluded.</text><text x="1490" y="865" font-size="21" text-anchor="end">IAmRobin.ai</text></g></svg>