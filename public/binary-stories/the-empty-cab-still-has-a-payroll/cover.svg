<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The empty cab still has a payroll</title>
  <desc id="desc">A driverless truck in the center of a ring of offboard support work: integration, monitoring, remote assistance, maintenance and recovery.</desc>
  <rect width="1600" height="900" fill="#091323"/>
  <path d="M70 73h64" stroke="#E0BA69" stroke-width="6"/>
  <text x="156" y="81" fill="#AFC0CF" font-family="Arial, sans-serif" font-size="25" letter-spacing="2">BINARY / INVEST</text>
  <text x="70" y="190" fill="#F2EFE7" font-family="Georgia, serif" font-size="75">The empty cab still has a payroll</text>
  <text x="72" y="244" fill="#AFC0CF" font-family="Arial, sans-serif" font-size="27">Customer-owned metal does not make offboard support free.</text>

  <g fill="none" stroke="#2D4558">
