<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The finish line is twenty points wide</title>
  <desc id="desc">Five progress bands lead to a model estimate. The highlighted 80 to 100 percent band remains separate from an external acceptance gate.</desc>
  <rect width="1600" height="900" fill="#07111f"/>
  <path d="M80 80H1520M80 820H1520" stroke="#19304a" stroke-width="2"/>
  <text x="82" y="128" fill="#58d6e8" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="5">BINARY · BUILD</text>
  <text x="82" y="228" fill="#f5f0e7" font-family="Georgia, serif" font-size="76" font-weight="700">The finish line is</text>
  <text x="82" y="312" fill="#e6b85c" font-family="Georgia, serif" font-size="76" font-weight="700">twenty points wide.</text>
  <text x="84" y="374" fill="#9eb1c6" font-family="Arial, sans-serif" font-size="26">Progress is a useful estimate. Acceptance is a separate receipt.</text>
  <g font-family="Arial, sans-serif" font-size="24" font-weight="700">
    <rect x="84" y="470" width="210" height="112" rx="12" fill="#10233a" stroke="#31516f" stroke-width="2"/>
    <text x="189" y="538" fill="#9eb1c6" text-anchor="middle">0–20%</text>
    <rect x="314" y="470" width="210" height="112" rx="12" fill="#10233a" stroke="#31516f" stroke-width="2"/>
    <text x="419" y="538" fill="#9eb1c6" text-anchor="middle">20–40%</text>
    <rect x="544" y="470" width="210" height="112" rx="12" fill="#10233a" stroke="#31516f" stroke-width="2"/>
    <text x="649" y="538" fill="#9eb1c6" text-anchor="middle">40–60%</text>
    <rect x="774" y="470" width="210" height="112" rx="12" fill="#10233a" stroke="#31516f" stroke-width="2"/>
    <text x="879" y="538" fill="#9eb1c6" text-anchor="middle">60–80%</text>
    <rect x="1004" y="454" width="242" height="144" rx="12" fill="#332a1a" stroke="#e6b85c" stroke-width="4"/>
    <text x="1125" y="527" fill="#f5d488" text-anchor="middle" font-size="34">80–100%</text>
    <text x="1125" y="563" fill="#d7b66f" text-anchor="middle" font-size="17" letter-spacing="2">MODEL BAND</text>
  </g>
  <path d="M1246 526H1328" stroke="#58d6e8" stroke-width="4"/>
  <path d="M1328 526l-16-10v20z" fill="#58d6e8"/>
  <rect x="1330" y="438" width="190" height="176" rx="18" fill="#0e2a32" stroke="#58d6e8" stroke-width="4"/>
  <path d="M1380 523l35 35 60-72" fill="none" stroke="#58d6e8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1425" y="587" fill="#bdeff5" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="2">ACCEPTANCE</text>
  <text x="84" y="712" fill="#f5f0e7" font-family="Arial, sans-serif" font-size="26" font-weight="700">Estimate progress → choose an action → verify the terminal state</text>
  <text x="84" y="760" fill="#7189a0" font-family="Arial, sans-serif" font-size="19">Gemini Robotics ER 2 · primary-source review · 2 November 2026</text>
  <text x="1518" y="768" fill="#7189a0" font-family="Arial, sans-serif" font-size="19" text-anchor="end">IAmRobin.ai</text>
</svg>
