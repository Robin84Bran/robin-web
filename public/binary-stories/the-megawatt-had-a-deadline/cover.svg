<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The megawatt had a deadline.</title>
  <desc id="desc">A 2027 customer window and an early-to-mid-2030s grid window appear on separate timelines with a visible gap between them.</desc>
  <rect width="1600" height="900" fill="#0B1228"/>
  <g opacity="0.12" stroke="#F4F1E9" stroke-width="1">
    <path d="M80 110H1520M80 260H1520M80 410H1520M80 560H1520M80 710H1520"/>
    <path d="M200 70V830M520 70V830M840 70V830M1160 70V830M1480 70V830"/>
  </g>
  <text x="110" y="112" fill="#61D4D7" font-family="Arial, sans-serif" font-size="28" letter-spacing="5">BINARY / BUILD</text>
  <text x="110" y="202" fill="#F4F1E9" font-family="Georgia, serif" font-size="72">The megawatt</text>
  <text x="110" y="282" fill="#F4F1E9" font-family="Georgia, serif" font-size="72">had a deadline.</text>
  <text x="110" y="340" fill="#B7C0D5" font-family="Arial, sans-serif" font-size="28">AI capacity is power, place and time arriving together.</text>
  <g font-family="Arial, sans-serif">
    <text x="120" y="455" fill="#B7C0D5" font-size="22" letter-spacing="3">CUSTOMER WINDOW</text>
    <rect x="120" y="485" width="480" height="118" rx="18" fill="#121D3A" stroke="#61D4D7" stroke-width="3"/>
    <text x="160" y="555" fill="#61D4D7" font-size="54" font-weight="700">Q1 2027</text>
    <text x="160" y="588" fill="#F4F1E9" font-size="22">~23,000 GB300 GPUs for Azure</text>
    <text x="1000" y="455" fill="#B7C0D5" font-size="22" letter-spacing="3">REPORTED GRID WINDOW</text>
    <rect x="1000" y="485" width="480" height="118" rx="18" fill="#121D3A" stroke="#D8B86B" stroke-width="3"/>
    <text x="1040" y="555" fill="#D8B86B" font-size="50" font-weight="700">EARLY–MID 2030s</text>
    <text x="1040" y="588" fill="#F4F1E9" font-size="22">expected grid-power horizon</text>
    <path d="M600 544H1000" stroke="#59647C" stroke-width="4" stroke-dasharray="14 12"/>
    <circle cx="800" cy="544" r="42" fill="#F4F1E9"/>
    <path d="M782 526L818 562M818 526L782 562" stroke="#0B1228" stroke-width="8" stroke-linecap="round"/>
    <text x="800" y="644" text-anchor="middle" fill="#F4F1E9" font-size="28" font-weight="700">NO OVERLAP</text>
    <text x="800" y="690" text-anchor="middle" fill="#B7C0D5" font-size="24">A later megawatt can be a different product.</text>
  </g>
  <text x="1490" y="842" text-anchor="end" fill="#B7C0D5" font-family="Arial, sans-serif" font-size="24">IAmRobin.ai</text>
</svg>
