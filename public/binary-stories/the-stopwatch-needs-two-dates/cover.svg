<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The stopwatch needs two dates</title>
  <desc id="desc">A delivery timeline shows two possible starts, contract and site work, followed by factory assembly, installation, commissioning, first workload, and later commercial operation.</desc>
  <rect width="1600" height="900" fill="#0B1228"/>
  <text x="96" y="102" fill="#61D4D7" font-family="Arial, sans-serif" font-size="25" letter-spacing="5">BINARY / INVEST</text>
  <text x="96" y="190" fill="#F4F1E9" font-family="Georgia, serif" font-size="64">The stopwatch needs two dates.</text>
  <text x="98" y="245" fill="#B8C1D8" font-family="Arial, sans-serif" font-size="28">A fast stage is not yet an auditable whole journey.</text>

  <line x1="125" y1="478" x2="1475" y2="478" stroke="#59647E" stroke-width="7"/>
  <line x1="125" y1="478" x2="1220" y2="478" stroke="#61D4D7" stroke-width="7"/>

  <g font-family="Arial, sans-serif">
    <circle cx="190" cy="478" r="20" fill="#D8B86B"/>
    <text x="132" y="420" fill="#D8B86B" font-size="23" font-weight="700">CONTRACT?</text>
    <text x="132" y="535" fill="#F4F1E9" font-size="21">commercial start</text>

    <circle cx="410" cy="478" r="20" fill="#D8B86B"/>
    <text x="372" y="420" fill="#D8B86B" font-size="23" font-weight="700">DIRT?</text>
    <text x="332" y="535" fill="#F4F1E9" font-size="21">site-work start</text>

    <circle cx="660" cy="478" r="17" fill="#61D4D7"/>
    <text x="604" y="420" fill="#61D4D7" font-size="21" font-weight="700">FACTORY</text>
    <text x="586" y="535" fill="#F4F1E9" font-size="20">assembly + test</text>

    <circle cx="890" cy="478" r="17" fill="#61D4D7"/>
    <text x="834" y="420" fill="#61D4D7" font-size="21" font-weight="700">INSTALL</text>
    <text x="815" y="535" fill="#F4F1E9" font-size="20">on-site work</text>

    <circle cx="1100" cy="478" r="17" fill="#61D4D7"/>
    <text x="1028" y="420" fill="#61D4D7" font-size="21" font-weight="700">ACCEPT</text>
    <text x="1016" y="535" fill="#F4F1E9" font-size="20">first workload</text>

    <circle cx="1370" cy="478" r="20" fill="#F4F1E9"/>
    <text x="1295" y="420" fill="#F4F1E9" font-size="21" font-weight="700">OPERATE</text>
    <text x="1254" y="535" fill="#F4F1E9" font-size="20">utilization + revenue</text>
  </g>

  <rect x="112" y="645" width="598" height="112" rx="18" fill="#121D3A" stroke="#D8B86B" stroke-width="2"/>
  <text x="145" y="690" fill="#D8B86B" font-family="Arial, sans-serif" font-size="22" font-weight="700">START MUST BE NAMED</text>
  <text x="145" y="728" fill="#F4F1E9" font-family="Arial, sans-serif" font-size="24">Contract and site work can be different dates.</text>

  <rect x="752" y="645" width="736" height="112" rx="18" fill="#121D3A" stroke="#61D4D7" stroke-width="2"/>
  <text x="785" y="690" fill="#61D4D7" font-family="Arial, sans-serif" font-size="22" font-weight="700">FINISH MUST BE ACCEPTED</text>
  <text x="785" y="728" fill="#F4F1E9" font-family="Arial, sans-serif" font-size="24">First token is not sustained commercial service.</text>

  <text x="96" y="840" fill="#8390AA" font-family="Arial, sans-serif" font-size="20">Vendor-stated 12–16 week benchmark · customer-level dates unpublished at 12 Nov 2026 cutoff</text>
  <text x="1504" y="840" text-anchor="end" fill="#F4F1E9" font-family="Arial, sans-serif" font-size="20">IAmRobin.ai</text>
</svg>
