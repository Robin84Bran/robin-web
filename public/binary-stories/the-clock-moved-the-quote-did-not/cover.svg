<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The clock moved. The quote did not.</title>
  <desc id="desc">Three aligned clocks show continuous economic accrual, a precise oracle, and a rounded quote that advances in visible steps.</desc>
  <rect width="1600" height="900" fill="#0B1228"/>
  <g opacity=".16" stroke="#61D4D7" stroke-width="1">
    <path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600"/>
    <path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/>
  </g>
  <text x="110" y="120" fill="#61D4D7" font-family="Arial, sans-serif" font-size="24" letter-spacing="5">BINARY / BUILD</text>
  <text x="110" y="235" fill="#F4F1E9" font-family="Georgia, serif" font-size="76">The clock moved.</text>
  <text x="110" y="325" fill="#D8B86B" font-family="Georgia, serif" font-size="76">The quote did not.</text>
  <g transform="translate(140 450)" font-family="Arial, sans-serif">
    <path d="M30 165 C210 60 410 260 590 120 S940 40 1120 115" fill="none" stroke="#61D4D7" stroke-width="8"/>
    <path d="M30 230 H320 V205 H610 V175 H900 V145 H1180" fill="none" stroke="#D8B86B" stroke-width="8"/>
    <circle cx="250" cy="135" r="86" fill="#0B1228" stroke="#61D4D7" stroke-width="4"/>
    <circle cx="610" cy="150" r="86" fill="#0B1228" stroke="#61D4D7" stroke-width="4"/>
    <circle cx="970" cy="135" r="86" fill="#0B1228" stroke="#D8B86B" stroke-width="4"/>
    <path d="M250 135L250 83M250 135L286 156M610 150L650 112M610 150L610 198M970 135L1009 110M970 135L970 82" stroke="#F4F1E9" stroke-width="6" stroke-linecap="round"/>
    <text x="250" y="270" fill="#F4F1E9" text-anchor="middle" font-size="25">ECONOMIC</text>
    <text x="610" y="270" fill="#F4F1E9" text-anchor="middle" font-size="25">ORACLE</text>
    <text x="970" y="270" fill="#F4F1E9" text-anchor="middle" font-size="25">DISPLAY</text>
  </g>
  <text x="1490" y="850" fill="#F4F1E9" opacity=".8" text-anchor="end" font-family="Arial, sans-serif" font-size="24">IAmRobin.ai</text>
</svg>
