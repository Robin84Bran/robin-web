<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f4f1e9"/><g fill="#0b1228" font-family="Arial, sans-serif"><text x="100" y="105" font-size="23" letter-spacing="5">BINARY / INVEST</text><text x="100" y="222" font-size="83" font-family="Georgia, serif">The cost of waiting</text><text x="100" y="290" font-size="29">Illustration: £100m drawn, 6% annual simple interest</text><text x="100" y="426" font-size="33">6 months</text><rect x="395" y="380" width="400" height="72" fill="#61d4d7"/><text x="832" y="428" font-size="40">£3m</text><text x="100" y="571" font-size="33">12 months</text><rect x="395" y="525" width="800" height="72" fill="#d8b86b"/><text x="1232" y="573" font-size="40">£6m</text><text x="100" y="727" font-size="29">Same balance. Six more months. £3m more gross interest.</text><text x="100" y="781" font-size="23" fill="#52616b">Hypothetical figures, not VIRTUS terms. Other costs and revenues excluded.</text><text x="1490" y="861" font-size="21" text-anchor="end">IAmRobin.ai</text></g></svg>