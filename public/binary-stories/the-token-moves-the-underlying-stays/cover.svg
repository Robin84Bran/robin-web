<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The token moves. The underlying stays at DTC.</title>
  <desc id="desc">A two-layer diagram shows an underlying security staying in DTC custody while a one-to-one-backed digital twin moves from one registered wallet to another.</desc>
  <rect width="1600" height="900" fill="#0B1228"/>

  <text x="96" y="92" fill="#61D4D7" font-family="Arial, sans-serif" font-size="24" letter-spacing="5">BINARY / BUILD</text>
  <text x="96" y="181" fill="#F4F1E9" font-family="Georgia, serif" font-size="67">The token moves.</text>
  <text x="96" y="257" fill="#F4F1E9" font-family="Georgia, serif" font-size="67">The underlying stays at DTC.</text>
  <text x="99" y="310" fill="#B8C1D8" font-family="Arial, sans-serif" font-size="27">One asset. Two coordinated layers.</text>

  <g font-family="Arial, sans-serif">
    <rect x="96" y="360" width="1408" height="150" rx="18" fill="#121D3A" stroke="#D8B86B" stroke-width="3"/>
    <text x="134" y="415" fill="#D8B86B" font-size="22" font-weight="700" letter-spacing="2">CUSTODY LAYER</text>
    <text x="134" y="469" fill="#F4F1E9" font-size="34" font-weight="700">UNDERLYING SECURITY</text>
    <text x="1468" y="469" text-anchor="end" fill="#F4F1E9" font-size="34" font-weight="700">STAYS AT DTC</text>

    <line x1="800" y1="510" x2="800" y2="609" stroke="#D8B86B" stroke-width="4"/>
    <text x="822" y="570" fill="#D8B86B" font-size="19" font-weight="700" letter-spacing="1.5">1:1 BACKING · SAME RIGHTS</text>

    <rect x="96" y="625" width="368" height="126" rx="16" fill="#121D3A" stroke="#61D4D7" stroke-width="2"/>
    <text x="128" y="674" fill="#61D4D7" font-size="20" font-weight="700" letter-spacing="2">REGISTERED WALLET A</text>
    <text x="128" y="718" fill="#F4F1E9" font-size="26">current holder</text>

    <circle cx="800" cy="688" r="76" fill="#61D4D7"/>
    <text x="800" y="680" text-anchor="middle" fill="#0B1228" font-size="21" font-weight="700" letter-spacing="1">DIGITAL TWIN</text>
    <text x="800" y="713" text-anchor="middle" fill="#0B1228" font-size="20">entitlement</text>

    <rect x="1136" y="625" width="368" height="126" rx="16" fill="#121D3A" stroke="#61D4D7" stroke-width="2"/>
    <text x="1168" y="674" fill="#61D4D7" font-size="20" font-weight="700" letter-spacing="2">REGISTERED WALLET B</text>
    <text x="1168" y="718" fill="#F4F1E9" font-size="26">approved recipient</text>

    <line x1="464" y1="688" x2="705" y2="688" stroke="#61D4D7" stroke-width="5"/>
    <path d="M690 675 L710 688 L690 701" fill="none" stroke="#61D4D7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="895" y1="688" x2="1136" y2="688" stroke="#61D4D7" stroke-width="5"/>
    <path d="M1121 675 L1141 688 L1121 701" fill="none" stroke="#61D4D7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="800" y="795" text-anchor="middle" fill="#B8C1D8" font-size="22">The entitlement changes hands. The custody anchor does not.</text>
  </g>

  <line x1="96" y1="835" x2="1504" y2="835" stroke="#24304E" stroke-width="2"/>
  <text x="96" y="868" fill="#8390AA" font-family="Arial, sans-serif" font-size="19">Current production: Canton + private Besu · Solana connection planned for H2 2027</text>
  <text x="1504" y="868" text-anchor="end" fill="#F4F1E9" font-family="Arial, sans-serif" font-size="20">IAmRobin.ai</text>
</svg>
