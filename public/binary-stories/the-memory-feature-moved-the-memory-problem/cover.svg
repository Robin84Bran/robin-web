<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The memory feature moved the memory problem</title>
  <desc id="desc">A durable application ledger creates a temporary five-minute server thread, sends deltas while it is live, then replays the complete ledger after expiry.</desc>
  <rect width="1600" height="900" fill="#07111f"/>
  <path d="M80 80H1520M80 820H1520" stroke="#19304a" stroke-width="2"/>
  <text x="82" y="126" fill="#58d6e8" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="5">BINARY · BUILD</text>
  <text x="82" y="230" fill="#f5f0e7" font-family="Georgia, serif" font-size="72" font-weight="700">The memory feature moved</text>
  <text x="82" y="312" fill="#e6b85c" font-family="Georgia, serif" font-size="72" font-weight="700">the memory problem.</text>
  <text x="84" y="374" fill="#9eb1c6" font-family="Arial, sans-serif" font-size="26">Temporary server context accelerates a path. Durable application state recovers it.</text>

  <g font-family="Arial, sans-serif">
    <rect x="84" y="458" width="352" height="220" rx="18" fill="#10233a" stroke="#58d6e8" stroke-width="4"/>
    <text x="116" y="508" fill="#58d6e8" font-size="18" font-weight="700" letter-spacing="3">APPLICATION LEDGER</text>
    <text x="116" y="570" fill="#f5f0e7" font-family="Georgia, serif" font-size="38" font-weight="700">Durable truth</text>
    <path d="M116 600H404" stroke="#31516f" stroke-width="2"/>
    <text x="116" y="642" fill="#9eb1c6" font-size="20">ordered conversation · replay</text>

    <path d="M436 527H580" stroke="#58d6e8" stroke-width="4"/>
    <path d="M580 527l-18-11v22z" fill="#58d6e8"/>
    <text x="508" y="506" fill="#9eb1c6" font-size="16" text-anchor="middle">CREATE</text>

    <rect x="584" y="438" width="350" height="260" rx="22" fill="#332a1a" stroke="#e6b85c" stroke-width="4"/>
    <text x="616" y="490" fill="#e6b85c" font-size="18" font-weight="700" letter-spacing="3">SERVER THREAD</text>
    <text x="616" y="554" fill="#f5f0e7" font-family="Georgia, serif" font-size="42" font-weight="700">5-minute copy</text>
    <path d="M616 582H902" stroke="#6f5b2c" stroke-width="2"/>
    <text x="616" y="626" fill="#d7c59d" font-size="20">full history → new deltas</text>
    <text x="616" y="663" fill="#d7c59d" font-size="20">replaceable remote reference</text>

    <path d="M934 527H1070" stroke="#e6b85c" stroke-width="4" stroke-dasharray="12 10"/>
    <path d="M1070 527l-18-11v22z" fill="#e6b85c"/>
    <text x="1002" y="505" fill="#d7b66f" font-size="16" text-anchor="middle">EXPIRES</text>

    <rect x="1074" y="458" width="446" height="220" rx="18" fill="#0e2a32" stroke="#58d6e8" stroke-width="4"/>
    <text x="1106" y="508" fill="#58d6e8" font-size="18" font-weight="700" letter-spacing="3">REPLAY-CREATE</text>
    <text x="1106" y="570" fill="#f5f0e7" font-family="Georgia, serif" font-size="38" font-weight="700">Restore context</text>
    <path d="M1106 600H1488" stroke="#31516f" stroke-width="2"/>
    <text x="1106" y="642" fill="#9eb1c6" font-size="20">from the application ledger</text>
  </g>

  <path d="M1298 698v62H260v-82" fill="none" stroke="#58d6e8" stroke-width="3" stroke-dasharray="9 8"/>
  <path d="M260 678l-11 18h22z" fill="#58d6e8"/>
  <text x="780" y="747" fill="#9eb1c6" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" letter-spacing="2">THE SHORTCUT EXPIRES · THE LEDGER REBUILDS</text>
  <text x="84" y="792" fill="#7189a0" font-family="Arial, sans-serif" font-size="19">Claude Message Threads · contract review · 3 November 2026</text>
  <text x="1518" y="792" fill="#7189a0" font-family="Arial, sans-serif" font-size="19" text-anchor="end">IAmRobin.ai</text>
</svg>

