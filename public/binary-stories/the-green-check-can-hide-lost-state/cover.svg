<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The green check can hide a lost state</title>
  <desc id="desc">A timeout flows through detection toward an unresolved checkpoint and a green accepted output, showing that final acceptance alone does not prove stateful recovery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071126"/>
      <stop offset="1" stop-color="#101b35"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#23314e" stroke-width="1" opacity=".42"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <text x="104" y="104" fill="#61d4d7" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5">BINARY / BUILD</text>
  <text x="104" y="184" fill="#f4f1e9" font-family="Georgia, serif" font-size="66" font-weight="700">The green check can hide a lost state.</text>
  <text x="104" y="235" fill="#aab5cc" font-family="Arial, sans-serif" font-size="27">Acceptance verifies the destination. Recovery evidence verifies the path.</text>

  <g font-family="Arial, sans-serif">
    <rect x="104" y="350" width="270" height="150" rx="18" fill="#111d38" stroke="#61d4d7" stroke-width="3"/>
    <text x="132" y="398" fill="#61d4d7" font-size="19" font-weight="700" letter-spacing="3">FAULT</text>
    <text x="132" y="451" fill="#f4f1e9" font-size="38" font-weight="700">TIMEOUT</text>
    <text x="132" y="483" fill="#aab5cc" font-size="19">named call · known time</text>

    <path d="M374 425H468" stroke="#61d4d7" stroke-width="5"/>
    <path d="M455 412l18 13-18 13" fill="none" stroke="#61d4d7" stroke-width="5"/>

    <rect x="486" y="350" width="270" height="150" rx="18" fill="#111d38" stroke="#61d4d7" stroke-width="3"/>
    <text x="514" y="398" fill="#61d4d7" font-size="19" font-weight="700" letter-spacing="3">DETECTION</text>
    <text x="514" y="451" fill="#f4f1e9" font-size="38" font-weight="700">CLASSIFIED</text>
    <text x="514" y="483" fill="#aab5cc" font-size="19">retry · stop · escalate</text>

    <path d="M756 425H816" stroke="#d8b86b" stroke-width="5" stroke-dasharray="13 13"/>
    <path d="M920 425H980" stroke="#d8b86b" stroke-width="5" stroke-dasharray="13 13"/>
    <circle cx="868" cy="425" r="49" fill="#2a2030" stroke="#d8b86b" stroke-width="4"/>
    <text x="850" y="441" fill="#d8b86b" font-size="48" font-weight="700">?</text>
    <text x="799" y="510" fill="#d8b86b" font-size="18" font-weight="700" letter-spacing="2">CHECKPOINT</text>

    <rect x="998" y="330" width="494" height="190" rx="24" fill="#122b2a" stroke="#7ee0a1" stroke-width="4" filter="url(#glow)"/>
    <circle cx="1060" cy="425" r="36" fill="#7ee0a1"/>
    <path d="M1041 425l13 13 27-31" fill="none" stroke="#071126" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1121" y="395" fill="#7ee0a1" font-size="19" font-weight="700" letter-spacing="3">DESTINATION</text>
    <text x="1121" y="447" fill="#f4f1e9" font-size="39" font-weight="700">OUTPUT ACCEPTED</text>
    <text x="1121" y="481" fill="#b8d7c4" font-size="19">correct bytes · unknown journey</text>
  </g>

  <line x1="104" y1="626" x2="1492" y2="626" stroke="#2b3854" stroke-width="2"/>
  <text x="104" y="694" fill="#d8b86b" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">THE EVIDENCE SPINE</text>
  <text x="104" y="755" fill="#f4f1e9" font-family="Georgia, serif" font-size="38">fault → detection → resume state → side-effect ledger → acceptance → delivery</text>
  <text x="104" y="815" fill="#aab5cc" font-family="Arial, sans-serif" font-size="22">A broken join leaves restart, resume and human rescue indistinguishable.</text>
  <text x="1410" y="848" fill="#f4f1e9" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="end">IAmRobin.ai</text>
</svg>
